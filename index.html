function tenantLogin(){
  const name=document.getElementById('tp-name')?.value?.trim().toLowerCase();
  const pin=document.getElementById('tp-pin')?.value?.trim();
  if(!pin){toast('Enter your PIN','var(--red)');return;}

  let found=null;
  APP.properties.forEach(p=>{
    p.units.forEach((u,i)=>{
      const tenant=p.tenants&&p.tenants[u];
      if(!tenant||!tenant.name)return;
      const tPin=tenant.pin||'1234';
      const nameMatch=!name||tenant.name.toLowerCase().includes(name)||tenant.email.toLowerCase().includes(name);
      if(tPin===pin&&nameMatch){
        found={propId:p.id,unitIdx:i};
      }
    });
  });

  if(found){
    sessionStorage.setItem('tenantPortalUnit',JSON.stringify(found));
    rTenantDashboard(found);
  } else {
    toast('Incorrect PIN or name','var(--red)');
    const inp=document.getElementById('tp-pin');
    if(inp){inp.value='';inp.style.borderColor='var(--red)';}
  }
}

function tenantQuickLogin(propId,unitIdx,pin){
  const info={propId,unitIdx:Number(unitIdx),tab:'home'};
  window._tenantInfo=info;
  sessionStorage.setItem('tenantPortalUnit',JSON.stringify(info));
  rTenantDashboard(info);
}

function setTenantTab(tab){
  if(window._tenantInfo){
    window._tenantInfo.tab=tab;
    rTenantDashboard(window._tenantInfo);

}

function tenantSignContract(info){
  const canvas=document.getElementById('tenant-sig-canvas');
  if(!canvas||isCanvasBlank('tenant-sig-canvas')){toast('Please draw your signature first','var(--amber)');return;}
  const p=APP.properties.find(x=>x.id===info.propId);
  const u=p&&p.units[info.unitIdx];
  const tenant=p&&u&&p.tenants&&p.tenants[u]||{};
  const date=new Date().toISOString().split('T')[0];

  // Build certificate
  const oc=document.createElement('canvas');oc.width=680;oc.height=320;
  const ctx=oc.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,680,320);
  ctx.fillStyle='#111827';ctx.fillRect(0,0,680,48);
  ctx.fillStyle='#ffffff';ctx.font='bold 15px Arial,sans-serif';
  ctx.fillText('TENANT SIGNATURE — LEASE CONTRACT',16,30);
  ctx.fillStyle='#60a5fa';ctx.font='12px Arial,sans-serif';ctx.fillText(date,580,30);
  ctx.fillStyle='#111827';ctx.font='bold 13px Arial,sans-serif';
  ctx.fillText((tenant.name||'Tenant')+' — '+(u||'')+(p?' · '+p.name:''),16,72);
  ctx.fillStyle='#6b7280';ctx.font='11px Arial,sans-serif';
  ctx.fillText('Lease: '+(tenant.leaseStart||'—')+' → '+(tenant.leaseEnd||'—')+'  ·  Rent: €'+p.rent[info.unitIdx]+'/mo',16,90);
  ctx.strokeStyle='#e5e7eb';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(16,108);ctx.lineTo(664,108);ctx.stroke();
  ctx.fillStyle='#1d4ed8';ctx.font='bold 12px Arial,sans-serif';ctx.fillText('Tenant signature:',16,132);
  ctx.fillStyle='#374151';ctx.font='11px Arial,sans-serif';ctx.fillText(tenant.name||'',16,148);
  ctx.drawImage(canvas,16,155,440,130);
  ctx.strokeStyle='#d1d5db';ctx.lineWidth=0.5;ctx.strokeRect(16,155,440,130);
  ctx.fillStyle='#9ca3af';ctx.font='10px Arial,sans-serif';
  ctx.fillText('Signed digitally via Orion Portfolio · '+new Date().toISOString(),16,302);

  const imgData=oc.toDataURL('image/png');
  if(!APP.documents)APP.documents=[];
  APP.documents.push({
    id:Date.now(),propId:info.propId,propName:p?p.short:'',unit:u||'',
    cat:'Lease contract',
    name:'Lease contract signed by '+(tenant.name||'Tenant')+' — '+date,
    date,note:'Signed digitally by tenant',data:imgData,type:'image/png'
  });
  try{save();}catch(e){toast('Could not save','var(--red)');return;}
  toast('Contract signed & saved ✓');
  rTenantDashboard({...info,tab:'lease'});
}

// Simple hash (not crypto-secure, but sufficient for local app PIN/password)
function simpleHash(str){
  let h=5381;
  for(let i=0;i<str.length;i++)h=((h<<5)+h)^str.charCodeAt(i);
  return'h'+(h>>>0).toString(16);
}

let AUTH_STATE={loggedIn:false,user:null};

function loadAuth(){
  try{
    const s=sessionStorage.getItem('auth');
    if(s){AUTH_STATE=JSON.parse(s);}
  }catch(e){}
}

function saveAuth(){
  try{sessionStorage.setItem('auth',JSON.stringify(AUTH_STATE));}catch(e){}
}

function checkAuth(){
  loadAuth();
  if(!AUTH_STATE.loggedIn){
    showAuthScreen();
    return false;
  }
  if(AUTH_STATE.user&&AUTH_STATE.user.role==='worker'){ try{document.getElementById('bnav').style.display='none';}catch(e){} nav={tab:'worker',view:'list',propId:null,unitIdx:null,subTab:0,addTab:0,ctx:{}}; rWorkerHome(); return false; }

    gTab('tenant');
    sessionStorage.setItem('tenantPortalUnit',JSON.stringify(info));

  return true;

// ── Unified login/register handlers ──────────────────────────────────────────
async function doLoginAs(role){
  const emailId=role==='landlord'?'ll-email':'tl-email';
  const pwId=role==='landlord'?'ll-pw':'tl-pw';
  const email=document.getElementById(emailId)?.value?.trim().toLowerCase();
  const pw=document.getElementById(pwId)?.value;
  const err=document.getElementById('auth-err');
  if(!email||!pw){if(err)err.textContent='Enter email and password';return;}
  if(role==='landlord' && typeof SBC!=='undefined' && SBC && typeof SB_URL!=='undefined' && SB_URL.indexOf('YOUR-PROJECT')<0){
    if(err)err.textContent='Signing in…';
    try{
      await sbSignIn(email, pw);
      try{ await sbEnsureAccount((document.getElementById('ll-name')&&document.getElementById('ll-name').value&&document.getElementById('ll-name').value.trim())||email); }catch(_){ }
      try{ APP=await sbLoadPortfolio(); }catch(_){ }
      AUTH_STATE={loggedIn:true,user:{role:'landlord',name:email,email:email}}; saveAuth();
      afterLogin(AUTH_STATE.user); return;
    }catch(e){ if(err)err.textContent=(e&&e.message)||'Login failed'; return; }
  }
  if(!APP.users)APP.users=[];
  const user=APP.users.find(u=>u.email.toLowerCase()===email);
  if(!user){if(err)err.textContent='No account found for this email';return;}
  if(user.role!==role){if(err)err.textContent='This account is registered as '+user.role+', not '+role;return;}
  const hash=simpleHash(pw);
  const demoOk=(user.pwHash==='$landlord$'&&pw==='landlord123')||(user.pwHash==='$tenant$'&&pw==='tenant123');
  if(user.pwHash!==hash&&!demoOk){if(err)err.textContent='Incorrect password';return;}
  AUTH_STATE={loggedIn:true,user};
  saveAuth();
  afterLogin(user);
}

async function doRegisterAs(role){
  const nameId=role==='landlord'?'ll-name':'tl-name';
  const emailId=role==='landlord'?'ll-email':'tl-email';
  const pwId=role==='landlord'?'ll-pw':'tl-pw';
  const pw2Id=role==='landlord'?'ll-pw2':'tl-pw2';
  const name=document.getElementById(nameId)?.value?.trim();
  const email=document.getElementById(emailId)?.value?.trim().toLowerCase();
  const pw=document.getElementById(pwId)?.value;
  const pw2=document.getElementById(pw2Id)?.value;
  const err=document.getElementById('auth-err');
  if(!name||!email||!pw){if(err)err.textContent='Fill in all fields';return;}
  if(pw.length<6){if(err)err.textContent='Password must be at least 6 characters';return;}
  if(pw!==pw2){if(err)err.textContent='Passwords do not match';return;}
  if(!APP.users)APP.users=[];
  if(APP.users.find(u=>u.email.toLowerCase()===email)){if(err)err.textContent='Email already registered';return;}
  const newUser={id:'u-'+Date.now(),role,name,email,pwHash:simpleHash(pw)};
  if(role==='landlord'){
    const code=document.getElementById('ll-code')?.value?.trim();
    if(code.toUpperCase()!=='PORTFOLIO2026'){if(err)err.textContent='Incorrect access code';return;}
    newUser.propIds='all';
    if(typeof SBC!=='undefined' && SBC && SB_URL.indexOf('YOUR-PROJECT')<0){
      try{
        const res=await sbSignUp(email, pw, name, name+"'s properties");
        if(!(res && res.session)){ if(err)err.textContent='Account created \u2014 check your email to confirm, then log in.'; return; }
        try{ APP=await sbLoadPortfolio(); }catch(_){}
        AUTH_STATE={loggedIn:true,user:{role:'landlord',name:name,email:email}}; saveAuth();
        afterLogin(AUTH_STATE.user); toast('Welcome, '+name+' \u2713'); return;
      }catch(e){ if(err)err.textContent=(e&&e.message)||'Sign-up failed'; return; }
    }
  } else {
    const pid=document.getElementById('tl-prop')?.value;
    const u=document.getElementById('tl-unit')?.value;
    const pin=document.getElementById('tl-pin')?.value?.trim();
    if(!pid||!u){if(err)err.textContent='Select property and unit';return;}
    const p=APP.properties.find(x=>x.id===pid);
    const uIdx=p?p.units.indexOf(u):-1;
    if(uIdx<0){if(err)err.textContent='Unit not found';return;}
    const tenant=p&&p.tenants&&p.tenants[u];
    if(tenant&&tenant.pin&&pin!==tenant.pin){if(err)err.textContent='Incorrect PIN — contact your landlord';return;}
    newUser.propId=pid;newUser.unitIdx=uIdx;newUser.unit=u;
  }
  APP.users.push(newUser);save();
  AUTH_STATE={loggedIn:true,user:newUser};saveAuth();
  afterLogin(newUser);
  toast('Welcome, '+name+' ✓');
}

function afterLogin(user){
  if(user&&user.role==='worker'){ try{document.getElementById('bnav').style.display='none';}catch(e){} nav={tab:'worker',view:'list',propId:null,unitIdx:null,subTab:0,addTab:0,ctx:{}}; rWorkerHome(); toast('Welcome, '+(user.name||'')+' \u2713'); return; }
  document.getElementById('bnav').style.display='';
  const sb=document.getElementById('search-btn');if(sb)sb.style.display='flex';
  if(user.role==='tenant'){
    const info={propId:user.propId,unitIdx:user.unitIdx};
    sessionStorage.setItem('tenantPortalUnit',JSON.stringify(info));
    // Set up tenant-only nav
    ['bn-rent','bn-maint','bn-finance','bn-search','bn-import','bn-add','bn-settings'].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.style.display='none';
    });
    document.getElementById('bn-tenant').style.display='';
    gTab('tenant');
    rTenantDashboard(info);
  } else {
    // Landlord — show all nav, hide tenant tab
    ['bn-rent','bn-maint','bn-finance','bn-search','bn-import','bn-add','bn-settings'].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.style.display='';
    });
    document.getElementById('bn-tenant').style.display='none';
    gTab('home');
  }
  toast('Welcome, '+user.name+' ✓');
}

  if(!user){if(err)err.textContent='No account found for this email';return;}

  const hash=simpleHash(pw);
  if(user.pwHash!==hash&&user.pwHash!=='$landlord$'&&user.pwHash!=='$tenant$'){
    if(err)err.textContent='Incorrect password';return;
  }
  // Special demo passwords
  if(user.pwHash==='$landlord$'&&pw!=='landlord123'){if(err)err.textContent='Incorrect password';return;}
  if(user.pwHash==='$tenant$'&&pw!=='tenant123'){if(err)err.textContent='Incorrect password';return;}

  AUTH_STATE={loggedIn:true,user};saveAuth();afterLogin(user);
}

function doRegister(){
  const role=window._regRole||'landlord';
  const name=document.getElementById('reg-name')?.value?.trim();
  const email=document.getElementById('reg-email')?.value?.trim().toLowerCase();
  const pw=document.getElementById('reg-pw')?.value;
  const pw2=document.getElementById('reg-pw2')?.value;
  const err=document.getElementById('auth-err');

  if(!name||!email||!pw){if(err)err.textContent='Fill in all fields';return;}
  if(pw.length<6){if(err)err.textContent='Password must be at least 6 characters';return;}
  if(pw!==pw2){if(err)err.textContent='Passwords do not match';return;}

  if(!APP.users)APP.users=[];
  if(APP.users.find(u=>u.email.toLowerCase()===email)){
    if(err)err.textContent='This email is already registered';return;
  }

  const newUser={id:'u-'+Date.now(),role,name,email,pwHash:simpleHash(pw)};

  if(role==='landlord'){
    const code=document.getElementById('reg-code')?.value?.trim();
    if(code!=='PORTFOLIO2026'&&code!=='portfolio2026'){
      if(err)err.textContent='Incorrect landlord access code';return;
    }
    newUser.propIds='all';
  } else {
    const pid=document.getElementById('reg-prop')?.value;
    const u=document.getElementById('reg-unit')?.value;
    const pin=document.getElementById('reg-pin')?.value?.trim();
    if(!pid||!u){if(err)err.textContent='Select your property and unit';return;}
    const p=APP.properties.find(x=>x.id===pid);
    const uIdx=p?p.units.indexOf(u):-1;
    if(uIdx<0){if(err)err.textContent='Unit not found';return;}
    const tenant=p&&p.tenants&&p.tenants[u];
    if(tenant&&tenant.pin&&pin!==tenant.pin){
      if(err)err.textContent='Incorrect PIN — contact your landlord';return;
    }
    newUser.propId=pid;
    newUser.unitIdx=uIdx;
    newUser.unit=u;
  }

  APP.users.push(newUser);save();AUTH_STATE={loggedIn:true,user:newUser};saveAuth();afterLogin(newUser);toast('Account created! Welcome, '+name+' ✓');
}

function doLogout(){
  try{ if(typeof SBC!=='undefined' && SBC && SB_URL.indexOf('YOUR-PROJECT')<0){ sbSignOut(); } }catch(e){}
  AUTH_STATE={loggedIn:false,user:null};
  try{sessionStorage.removeItem('auth');}catch(e){}
  try{sessionStorage.removeItem('tenantPortalUnit');}catch(e){}
  // Reset all nav items to visible for next login
  ['bn-home','bn-rent','bn-maint','bn-finance','bn-search','bn-import','bn-add','bn-settings','bn-tenant'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.style.display='';
  });
  document.getElementById('bnav').style.display='none';
  const _sb=document.getElementById('search-btn');if(_sb)_sb.style.display='none';
  showAuthScreen();
}

function openSearch(){
  const overlay=document.getElementById('search-overlay');
  if(overlay){overlay.style.display='flex';setTimeout(()=>document.getElementById('search-input')?.focus(),80);}
}
function closeSearch(){
  const overlay=document.getElementById('search-overlay');
  if(overlay){overlay.style.display='none';}
  const inp=document.getElementById('search-input');
  if(inp)inp.value='';
  document.getElementById('search-results').innerHTML='';
}

function highlight(text,query){
  if(!query||!text)return String(text||'');
  // Simple highlight without regex special char escaping
  const ql=query.toLowerCase();
  const str=String(text);
  const idx=str.toLowerCase().indexOf(ql);
  if(idx<0)return str;
  return str.slice(0,idx)+'<mark>'+str.slice(idx,idx+query.length)+'</mark>'+str.slice(idx+query.length);
}

function runSearch(q){
  q=(q||'').trim();
  const res=document.getElementById('search-results');
  if(!res)return;
  if(q.length<2){res.innerHTML=`<div style="padding:40px 20px;text-align:center;color:var(--txt3);font-size:13px">Type at least 2 characters to search</div>`;return;}
  const ql=q.toLowerCase();
  const results=[];

  APP.properties.forEach(p=>{
    // Property match
    if(p.name.toLowerCase().includes(ql)||p.location.toLowerCase().includes(ql)){
      results.push({type:'property',icon:'🏢',color:'var(--blue-l)',
        title:p.name,sub:p.location+' · '+p.units.length+' units · €'+p.totalIncome.toLocaleString()+'/mo',
        action:()=>{closeSearch();push({view:'prop',propId:p.id,tab:'home'});}});
    }
    // Units + tenants
    p.units.forEach((u,i)=>{
      const tenant=p.tenants&&p.tenants[u];
      const tn=tenant&&tenant.name||'';
      const te=tenant&&tenant.email||'';
      const tp=tenant&&tenant.phone||'';
      const matchUnit=u.toLowerCase().includes(ql);
      const matchTenant=tn.toLowerCase().includes(ql)||te.toLowerCase().includes(ql)||tp.toLowerCase().includes(ql);
      if(matchUnit||matchTenant){
        results.push({type:'unit',icon:'🏠',color:'var(--bg3)',
          title:highlight(u+' · '+p.short,q),
          sub:(tn?highlight(tn,q):'Vacant')+(te?' · '+highlight(te,q):'')+(tp?' · '+highlight(tp,q):'')+'<br>EPC '+p.epc[i]+' · '+p.area[i]+'m² · €'+p.rent[i]+'/mo',
          action:()=>{closeSearch();push({view:'unit',propId:p.id,unitIdx:i,tab:'home'});}});
      }
      // Rent status — find months with issues
      const rs=p.rentStatus[u]||{};
      Object.entries(rs).forEach(([yr,months])=>{
        if(typeof months==='object'){
          Object.entries(months).forEach(([mo,status])=>{
            if((status==='missing'||status==='late')&&(mo.toLowerCase().includes(ql)||String(yr).includes(ql)||(tn&&tn.toLowerCase().includes(ql)))){
              results.push({type:'rent',icon:'⚠',color:'var(--red-l)',
                title:highlight(p.short+' · '+u,q)+' — '+mo+' '+yr,
                sub:'Status: '+status+(tn?' · '+highlight(tn,q):''),
                action:()=>{closeSearch();gTab('rent');push({tab:'rent',view:'detail',propId:p.id,unitIdx:i});}});
            }
          });
        }
      });
    });
    // Contractors + jobs
    p.contractors.forEach(c=>{
      const matchC=c.name.toLowerCase().includes(ql)||c.trade.toLowerCase().includes(ql)||c.contact.toLowerCase().includes(ql)||c.phone.toLowerCase().includes(ql);
      if(matchC){
        results.push({type:'contractor',icon:'🔧',color:'var(--amber-l)',
          title:highlight(c.name,q),
          sub:c.trade+' · '+highlight(c.contact,q)+(c.phone?' · '+highlight(c.phone,q):''),
          action:()=>{closeSearch();gTab('maint');}});
      }
      c.jobs.forEach(j=>{
        if(j.desc.toLowerCase().includes(ql)||j.unit.toLowerCase().includes(ql)||(j.inv&&j.inv.toLowerCase().includes(ql))){
          results.push({type:'job',icon:'🛠',color:'var(--teal-l)',
            title:highlight(j.desc,q),
            sub:p.short+' · '+j.unit+' · '+j.date+(j.cost?' · €'+j.cost:''),
            action:()=>{closeSearch();gTab('maint');}});
        }
      });
    });
  });

  // Documents
  (APP.documents||[]).forEach(d=>{
    if(d.name.toLowerCase().includes(ql)||d.cat.toLowerCase().includes(ql)||(d.note&&d.note.toLowerCase().includes(ql))){
      results.push({type:'doc',icon:'📄',color:'var(--purple-l)',
        title:highlight(d.name,q),
        sub:d.cat+' · '+d.propName+(d.unit?' · '+d.unit:'')+(d.date?' · '+d.date:''),
        action:()=>{closeSearch();push({tab:'settings',view:'docview',ctx:{docId:d.id}});}});
    }
  });

  // Messages
  (APP.messages||[]).filter(m=>m.text&&m.text.toLowerCase().includes(ql)).slice(0,5).forEach(m=>{
    results.push({type:'msg',icon:'💬',color:'var(--bg3)',
      title:'Message: '+highlight(m.text.slice(0,60),q)+(m.text.length>60?'…':''),
      sub:m.time+' · '+(m.dir==='out'?'Sent':'Received'),
      action:()=>{closeSearch();}});
  });

  if(!results.length){
    res.innerHTML=`<div style="padding:48px 20px;text-align:center">
      <div style="font-size:32px;margin-bottom:12px">🔍</div>
      <div style="font-size:14px;font-weight:500;color:var(--txt);margin-bottom:6px">No results for "${q}"</div>
      <div style="font-size:12px;color:var(--txt2)">Try searching for a tenant name, property, unit, contractor, or document</div>
    </div>`;
    return;
  }

  // Group by type
  const groups=[
    {key:'property',label:'Properties'},
    {key:'unit',label:'Units & tenants'},
    {key:'rent',label:'Rent alerts'},
    {key:'contractor',label:'Contractors'},
    {key:'job',label:'Jobs'},
    {key:'doc',label:'Documents'},
    {key:'msg',label:'Messages'},
  ];
  let html='<div style="padding:6px 14px 2px;font-size:11px;color:var(--txt3)">'+results.length+' result'+(results.length!==1?'s':'')+'</div>';
  groups.forEach(g=>{
    const items=results.filter(r=>r.type===g.key);
    if(!items.length)return;
    html+=`<div class="sr-sect">${g.label}</div>`;
    items.forEach(r=>{
      html+=`<div class="sr-item" onclick="(${r.action.toString()})()">
        <div class="sr-ico" style="background:${r.color}">${r.icon}</div>
        <div class="sr-body">
          <div class="sr-title">${r.title}</div>
          <div class="sr-sub">${r.sub}</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--txt3)" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:4px"><path d="M9 18l6-6-6-6"/></svg>
      </div>`;
    });
  });
  res.innerHTML=html;
}

function uploadJobInvoice(jobInfo){
  // jobInfo is passed as an object via onclick attribute

  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end';
  overlay.innerHTML=`<div style="background:var(--bg2);border-radius:var(--r) var(--r) 0 0;padding:20px 16px;width:100%">
    <div style="font-size:14px;font-weight:600;margin-bottom:4px">Attach invoice</div>
    <div style="font-size:12px;color:var(--txt2);margin-bottom:14px">${info.jobDesc||''} · ${info.jobDate||''}</div>
    <div class="upload-zone" onclick="document.getElementById('inv-file-inp').click()" style="margin-bottom:10px">
      <div style="font-size:24px;margin-bottom:4px">📄</div>
      <div style="font-weight:500;font-size:13px">Tap to select invoice</div>
      <div style="font-size:11px;color:var(--txt3)">PDF, JPG, PNG</div>
    </div>
    <input type="file" id="inv-file-inp" accept="image/*,application/pdf" style="display:none" onchange="saveJobInvoice(event,'${info.propId||''}','${(info.contractor||'').replace(/'/g,'\'')}','${(info.jobDesc||'').replace(/'/g,'\'').replace(/"/g,'')}','${info.jobDate||''}')">
    <button class="btn btn-ghost" onclick="this.closest('.inv-overlay').remove()">Cancel</button>
  </div>`;
  overlay.className='inv-overlay';

function saveJobInvoice(event,propId,contractor,jobDesc,jobDate){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    if(!APP.documents)APP.documents=[];
    const p=APP.properties.find(x=>x.id===propId);
    const docId=Date.now();
    APP.documents.push({
      id:docId,propId,propName:p?p.short:'',unit:'',
      cat:'Renovation invoice',
      name:'Invoice — '+jobDesc.slice(0,40)+' ('+jobDate+')',
      date:jobDate||new Date().toISOString().split('T')[0],
      note:'Contractor: '+contractor,
      data:ev.target.result,type:file.type
    });
    // Link invoice to the job
    if(p){
      p.contractors.forEach(c=>{
        if(c.name===contractor){
          c.jobs.forEach(j=>{
            if(j.desc===jobDesc&&j.date===jobDate){
              j.invoiceDocId=docId;
            }
          });
        }
      });
    }
    try{save();}catch(e){toast('File too large to save','var(--red)');return;}
    document.querySelector('.inv-overlay')?.remove();
    toast('Invoice saved ✓');
    rWorkCosts();
  };
  reader.readAsDataURL(file);
}

function logJobNote(propId,contractor){

    <button class="btn btn-success" style="margin-top:8px" onclick="saveJobNote('${propId}','${contractor}')">Save note</button>
    <button class="btn btn-ghost" style="margin-top:6px" onclick="this.closest('.job-note-modal').remove()">Cancel</button>
  </div>`;
  modal.className='job-note-modal';

  document.getElementById('job-note-txt')?.focus();

function saveJobNote(propId,contractor){
  const txt=document.getElementById('job-note-txt')?.value?.trim();
  if(!txt)return;
  if(!APP.notifications)APP.notifications=[];
  const p=APP.properties.find(x=>x.id===propId);
  APP.notifications.unshift({id:Date.now(),type:'info',title:'Job note: '+contractor,body:txt+' · '+(p?p.short:''),time:'just now',read:false});
  save();
  document.querySelector('.job-note-modal')?.remove();
  toast('Note saved ✓');
}

const COL_PATTERNS = {
  property:   [/property|pand|bien|adress|rue|straat|gebouw/i],
  unit:        [/unit|flat|app|woning|logement|kamer|room|number/i],
  tenant:      [/tenant|huurder|locataire|name|naam|nom|occupant/i],
  email:       [/email|e-mail|mail/i],
  phone:       [/phone|tel|gsm|mobil|nummer/i],
  rent:        [/rent|huur|loyer|amount|bedrag|montant|price|prijs/i],
  area:        [/area|surface|opp|m2|m²|size|taille/i],
  epc:         [/epc|peb|energy|energie|label/i],
  leaseStart:  [/start|begin|début|ingangsdatum|commencement/i],
  leaseEnd:    [/end|eind|fin|expir|aflop/i],
  deposit:     [/deposit|waarborg|garantie|caution/i],
  iban:        [/iban|account|bankrekening|compte/i],
  status:      [/status|statut|betaal|paid|payment/i],
};

function detectColumn(header, patterns) {
  for (const [key, rxList] of Object.entries(patterns)) {
    if (rxList.some(rx => rx.test(header))) return key;
  }
  return null;
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      let workbook;
      if (file.name.endsWith('.csv') || file.name.endsWith('.tsv')) {
        workbook = XLSX.read(e.target.result, {type:'string'});
      } else {
        workbook = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      }

      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});

      if (!rows || rows.length < 2) {
        toast('File appears empty or has no data rows','var(--err)');
        return;
      }

      const headers = rows[0].map(h => String(h||'').trim());
      const dataRows = rows.slice(1).filter(r => r.some(c => c !== ''));

      window._importData = { headers, dataRows, fileName: file.name, sheetName };
      showColumnMapping(headers, dataRows, file.name);
    } catch(err) {
      toast('Could not read file: ' + err.message, 'var(--err)');
    }
  };

  if (file.name.endsWith('.csv') || file.name.endsWith('.tsv')) {
    reader.readAsText(file);
  } else {
    reader.readAsArrayBuffer(file);
  }
}

function runImportPreview() {
  const { headers, dataRows } = window._importData || {};
  const mapping = window._importMapping || {};
  if (!dataRows) return;

  // Parse rows into structured records
  const records = [];
  const errors = [];

  dataRows.forEach((row, idx) => {
    const get = (key) => {
      const col = mapping[key];
      if (col === null || col === undefined) return '';
      return String(row[col] || '').trim();
    };

    const propName = get('property') || 'Imported Property';
    const unitName = get('unit') || `Unit ${idx+1}`;
    const rent = parseFloat(get('rent')) || 0;
    const area = parseFloat(get('area')) || 0;
    const epc = get('epc').toUpperCase().replace(/[^A-G+]/g,'').charAt(0) || 'D';

    if (!propName && !unitName && !rent) {
      errors.push(`Row ${idx+2}: empty row skipped`);
      return;
    }

    records.push({
      propName, unitName,
      tenant: get('tenant'),
      email: get('email'),
      phone: get('phone'),
      rent, area, epc,
      leaseStart: get('leaseStart'),
      leaseEnd: get('leaseEnd'),
      deposit: parseFloat(get('deposit')) || 0,
      iban: get('iban'),
      status: get('status').toLowerCase(),
    });
  });

  window._importRecords = records;
  showImportPreview(records, errors);
}

function confirmImport() {
  const records = window._importRecords;
  if (!records || !records.length) return;

  // Group by property name
  const byProp = {};
  records.forEach(r => {
    if (!byProp[r.propName]) byProp[r.propName] = [];
    byProp[r.propName].push(r);
  });

  let newProps = 0, newUnits = 0;

  Object.entries(byProp).forEach(([propName, units]) => {
    // Find or create property
    let p = APP.properties.find(x =>
      x.name.toLowerCase().includes(propName.toLowerCase()) ||
      propName.toLowerCase().includes(x.name.toLowerCase()) ||
      x.short.toLowerCase().includes(propName.toLowerCase())
    );

    if (!p) {
      // Create new property
      const colors = ['#7c6df0','#3ecf8e','#f59e0b','#60a5fa','#f87171','#a78bfa'];
      p = {
        id: 'imp-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
        name: propName, short: propName.split(' ').slice(0,3).join(' '),
        location: '', color: colors[APP.properties.length % colors.length],
        units:[], totalIncome:0, totalCosts:0, loan:0,
        epc:[], area:[], rent:[],
        rentStatus:{}, tenants:{}, meters:{}, contractors:[],
        costs:{loan:0,water:0,electricity:0,cadastral:0,insurance:0,unpredictables:0,other:0},
        documents:[], inspections:[],
      };
      APP.properties.push(p);
      newProps++;
    }

    // Add units
    units.forEach(u => {
      const unitName = u.unitName;
      if (!p.units.includes(unitName)) {
        p.units.push(unitName);
        p.epc.push(u.epc || 'D');
        p.area.push(u.area || 0);
        p.rent.push(u.rent || 0);
        p.rentStatus[unitName] = {};
        newUnits++;

        if (u.tenant) {
          if (!p.tenants) p.tenants = {};
          p.tenants[unitName] = {
            name: u.tenant, email: u.email||'', phone: u.phone||'',
            leaseStart: u.leaseStart||'', leaseEnd: u.leaseEnd||'',
            deposit: u.deposit||0, depositLoc:'',
            lang:'', registered:'', id:'', emergency:'', emergencyPhone:'',
            pin: String(1000 + Math.floor(Math.random()*9000)),
          };
        }
      }
    });

    // Recalculate total income
    p.totalIncome = p.rent.reduce((a,r) => a+r, 0);
  });

  try { save(); } catch(e) {
    toast('Import succeeded but data too large to save fully','var(--warn)');
  }

  document.getElementById('import-overlay')?.remove();
  window._importData = null;
  window._importRecords = null;
  window._importMapping = null;

  // Show success
  const msg = `✓ Imported ${newUnits} unit${newUnits!==1?'s':''} across ${newProps} new propert${newProps!==1?'ies':'y'}`;
  toast(msg);

  // Refresh home
  gTab('home');
}

const COL_MAP_PATTERNS={
  property:   /property|prop|building|pand|immeuble|rue|straat|adres/i,
  unit:       /^unit|apt|app|flat|woning|studio|appartement|chambre/i,
  tenant:     /tenant|huurder|locataire|naam|name|nom|bewoner/i,
  email:      /email|mail/i,
  phone:      /phone|tel|gsm|mobil|portable|nummer/i,
  rent:       /^rent|^huur|loyer|montant|bedrag|amount|price|prix/i,
  area:       /area|m2|m²|surf|opp|size|grootte/i,
  epc:        /^epc$|^peb$|energy.?label|energieklasse/i,
  leaseStart: /start|begin|début|ingangsdatum|date.entr|depuis/i,
  leaseEnd:   /end|einde|fin|verval|expir|échéance|jusqu/i,
  deposit:    /deposit|waarborg|caution|garantie|borg/i,
  iban:       /^iban/i,
  status:     /status|staat|statut|bezet|occupied|vacant/i,
};

function detectCols(headers){
  const map={};
  headers.forEach((h,i)=>{
    const hs=String(h||'').trim();
    if(!hs)return;
    for(const[field,rx]of Object.entries(COL_MAP_PATTERNS)){
      if(!Object.prototype.hasOwnProperty.call(map,field)&&rx.test(hs)){
        map[field]=i;
      }
    }
  });
  return map;
}

    const skipped=rows.length-preview.length;
    body.innerHTML=`
    <div class="card">
      <div style="font-size:13px;font-weight:600;margin-bottom:4px">Ready to import</div>

        <span style="color:var(--ok);font-weight:600">${preview.length} units</span> found
        ${skipped?` · <span style="color:var(--warn)">${skipped} rows skipped</span>`:''}
      </div>
      <div style="max-height:360px;overflow-y:auto">
        ${preview.map(it=>`
        <div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--b0)">
          <div style="width:32px;height:32px;border-radius:var(--r6);background:var(--ac3);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🏠</div>

  }
}

function impFileSelected(e){
  const file=e.target.files[0];if(!file)return;
  const ext=file.name.split('.').pop().toLowerCase();
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      let headers=[],rows=[];
      if(ext==='csv'){
        const lines=ev.target.result.split(/\r?\n/).filter(l=>l.trim());
        const split=l=>{const out=[];let cur='',inQ=false;for(const c of l){if(c==='"')inQ=!inQ;else if(!inQ&&(c===','||c===';'||c==='\t')){out.push(cur.trim());cur='';}else cur+=c;}out.push(cur.trim());return out;};
        headers=split(lines[0]).map(h=>h.replace(/^"|"$/g,'').trim());
        rows=lines.slice(1).map(split).filter(r=>r.some(c=>c));
      } else {
        if(!window.XLSX){toast('Loading Excel reader…','var(--warn)');setTimeout(()=>impFileSelected(e),900);return;}
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        headers=data[0].map(h=>String(h||'').trim());
        rows=data.slice(1).filter(r=>r.some(c=>String(c||'').trim()));
      }
      window._imp.headers=headers;
      window._imp.rows=rows;
      window._imp.colMap=detectCols(headers);
      toast('File loaded: '+rows.length+' rows ✓');
      renderImpStep(2);
    }catch(err){toast('Could not read: '+err.message,'var(--err)');}
  };
  if(ext==='csv')reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

function impBuildPreview(){
  Object.keys(COL_MAP_PATTERNS).forEach(f=>{
    const s=document.getElementById('cmap-'+f);
    if(s)window._imp.colMap[f]=s.value!==''?Number(s.value):null;
  });
  const {rows,colMap}=window._imp;
  const g=(row,f)=>{const i=colMap[f];return(i==null)?'':String(row[i]||'').trim();};
  const preview=rows.map(row=>{
    const prop=g(row,'property'),unit=g(row,'unit');
    if(!prop&&!unit)return null;
    const ep=APP.properties.find(p=>p.name.toLowerCase().includes((prop||'').toLowerCase().slice(0,6))||prop.toLowerCase().includes(p.short.toLowerCase().slice(0,4)));
    const eu=ep&&ep.units.find(u=>u.toLowerCase()===unit.toLowerCase());
    return{prop,unit,tenant:g(row,'tenant'),email:g(row,'email'),phone:g(row,'phone'),rent:g(row,'rent'),area:g(row,'area'),epc:g(row,'epc'),leaseStart:g(row,'leaseStart'),leaseEnd:g(row,'leaseEnd'),deposit:g(row,'deposit'),iban:g(row,'iban'),_new:!eu};
  }).filter(Boolean);
  window._imp.preview=preview;
  renderImpStep(3);
}

function impConfirm(){
  const {preview}=window._imp;
  let newProps=0,newUnits=0,newTenants=0,updated=0;
  const colors=['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];

  preview.forEach(it=>{
    let p=APP.properties.find(pr=>pr.name.toLowerCase().includes((it.prop||'').toLowerCase().slice(0,5))||it.prop.toLowerCase().includes((pr.short||'').toLowerCase().slice(0,4)));
    if(!p){
      p={id:'p'+Date.now()+Math.random().toString(36).slice(2,5),name:it.prop,short:it.prop.split(' ').slice(0,3).join(' '),location:it.prop,color:colors[APP.properties.length%6],units:[],rent:[],area:[],epc:[],tenants:{},rentStatus:{},meters:{},contractors:[],totalIncome:0,totalCosts:0,loan:0,insurance:0,tax:0};
      APP.properties.push(p);newProps++;
    }
    const uName=it.unit||('Unit '+(p.units.length+1));
    let uIdx=p.units.indexOf(uName);
    if(uIdx<0){
      p.units.push(uName);
      p.rent.push(Number(it.rent)||0);
      p.area.push(Number(it.area)||0);
      p.epc.push((it.epc||'D').toUpperCase().charAt(0));
      p.rentStatus[uName]={};
      p.tenants[uName]={name:'',email:'',phone:'',pin:String(1000+Math.floor(Math.random()*9000))};
      uIdx=p.units.length-1;newUnits++;
    } else {
      if(it.rent)p.rent[uIdx]=Number(it.rent)||p.rent[uIdx];
      if(it.area)p.area[uIdx]=Number(it.area)||p.area[uIdx];
      if(it.epc)p.epc[uIdx]=(it.epc||'D').toUpperCase().charAt(0);
      updated++;
    }
    if(it.tenant){
      const ex=p.tenants[uName]||{};
      const isNew=!ex.name||ex.name!==it.tenant;
      p.tenants[uName]={name:it.tenant,email:it.email||ex.email||'',phone:it.phone||ex.phone||'',leaseStart:it.leaseStart||ex.leaseStart||'',leaseEnd:it.leaseEnd||ex.leaseEnd||'',deposit:Number(it.deposit)||ex.deposit||0,iban:it.iban||ex.iban||'',lang:ex.lang||'EN',pin:ex.pin||String(1000+Math.floor(Math.random()*9000))};
      if(isNew)newTenants++;
    }
    p.totalIncome=p.rent.reduce((a,r)=>a+r,0);
  });

  try{migrateTenantPins(APP);}catch(e){}
  save();
  window._imp.stats={props:APP.properties.length,units:APP.properties.reduce((a,p)=>a+p.units.length,0),tenants:newTenants,updated};
  renderImpStep(4);
}

function exportData(){
  const json=JSON.stringify(APP,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='portfolio-data-'+new Date().toISOString().split('T')[0]+'.json';a.click();
  toast('Data exported ✓');
}

function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{APP=JSON.parse(ev.target.result);save();render();toast('Data imported ✓');}catch{toast('Invalid file','var(--red)');}};r.readAsText(f);};
  inp.click();
}

<script>
/* ---- PWA: service worker registered from an inline blob (single-file friendly) ---- */
(function(){
  if(!('serviceWorker' in navigator)) return;
  var swCode = `
    var CACHE='portfolio-pwa-v1';
    self.addEventListener('install', function(e){ self.skipWaiting(); });
    self.addEventListener('activate', function(e){ e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch', function(e){
      var req=e.request;
      if(req.method!=='GET'){ return; }
      // network-first for the app + CDNs, fall back to cache when offline
      e.respondWith(
        fetch(req).then(function(res){
          try{ var c=res.clone(); caches.open(CACHE).then(function(k){ k.put(req,c); }); }catch(_){}
          return res;
        }).catch(function(){ return caches.match(req); })
      );
    });
  `;
  try{
    var blob=new Blob([swCode],{type:'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(err){
      console.warn('SW registration skipped:', err && err.message);
    });
  }catch(e){ console.warn('SW not started:', e && e.message); }
})();

/* ---- PWA: "Install app" button appears when the browser allows it ---- */
(function(){
  var deferred=null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred=e;
    var b=document.createElement('button');
    b.textContent='Install app';
    b.setAttribute('style','position:fixed;right:16px;bottom:16px;z-index:99999;'+
      'padding:10px 16px;border:0;border-radius:10px;background:#1F4E5A;color:#fff;'+
      'font:600 14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer');
    b.onclick=function(){ b.remove(); if(deferred){ deferred.prompt(); deferred=null; } };
    document.body.appendChild(b);
    window.addEventListener('appinstalled', function(){ b.remove(); });
  });
})();
</script>

<script>
/* ===================== WORKER EXPERIENCE (v26, role-gated) ===================== */
window._wk = window._wk || {tab:'jobs', profile:null, _days:null};
function _wkConfigured(){ return (typeof SBC!=='undefined' && SBC && typeof SB_URL!=='undefined' && SB_URL.indexOf('YOUR-PROJECT')<0); }
function _wesc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---- Supabase data (worker side) ---- */
async function sbWorkerEnsureProfile(name,email){
  const { data:me } = await SBC.auth.getUser(); const uid=me.user.id;
  const { data:rows } = await SBC.from('worker_profiles').select('*').eq('profile_id',uid).limit(1);
  if(rows&&rows.length) return rows[0];
  const { data:ins, error } = await SBC.from('worker_profiles')
    .insert({ profile_id:uid, display_name:name||email||'Worker', is_public:true, is_active:true }).select('*').single();
  if(error) throw new Error(error.message); return ins;
}
async function sbWorkerLoadProfile(){
  const { data:me } = await SBC.auth.getUser();
  const { data } = await SBC.from('worker_profiles').select('*').eq('profile_id',me.user.id).limit(1);
  return (data&&data[0])||null;
}
async function sbWorkerSaveProfile(f){
  const { data:me } = await SBC.auth.getUser();
  const { error } = await SBC.from('worker_profiles').update(f).eq('profile_id',me.user.id);
  if(error) throw new Error(error.message);
}
async function sbWorkerLoadAvailability(workerId){
  const { data } = await SBC.from('worker_availability').select('weekday').eq('worker_id',workerId);
  return (data||[]).map(function(r){return r.weekday;});
}
async function sbWorkerSetAvailability(workerId, days){
  await SBC.from('worker_availability').delete().eq('worker_id',workerId);
  if(days.length){ const { error } = await SBC.from('worker_availability').insert(days.map(function(d){return {worker_id:workerId, weekday:d};}));
    if(error) throw new Error(error.message); }
}
async function sbListOpenJobs(){
  const { data } = await SBC.from('jobs').select('*').eq('status','open').order('created_at',{ascending:false}).limit(200);
  return data||[];
}
async function sbMyApplications(){
  const { data:me } = await SBC.auth.getUser();
  const { data } = await SBC.from('job_applications').select('job_id,status').eq('worker_id',me.user.id);
  return data||[];
}
async function sbApplyToJob(jobId, note){
  const { data:me } = await SBC.auth.getUser();
  const { error } = await SBC.from('job_applications').insert({ job_id:jobId, worker_id:me.user.id, note:note||null });
  if(error) throw new Error(error.message);
}

/* ---- worker auth handlers ---- */
async function doWorkerLogin(){
  const email=(document.getElementById('wk-email')||{}).value, pw=(document.getElementById('wk-pw')||{}).value, err=document.getElementById('auth-err');
  if(!email||!pw){ if(err)err.textContent='Enter email and password'; return; }
  if(!_wkConfigured()){ if(err)err.textContent='Worker accounts need the app connected to Supabase.'; return; }
  try{ await sbSignIn(email.trim().toLowerCase(), pw);
    const prof=await sbWorkerEnsureProfile('',email);
    AUTH_STATE={loggedIn:true,user:{role:'worker',name:prof.display_name||email,email:email,workerId:prof.id}}; saveAuth();
    afterLogin(AUTH_STATE.user);
  }catch(e){ if(err)err.textContent=(e&&e.message)||'Login failed'; }
}
async function doWorkerRegister(){
  const name=(document.getElementById('wk-name')||{}).value, email=(document.getElementById('wk-email')||{}).value,
        pw=(document.getElementById('wk-pw')||{}).value, trade=(document.getElementById('wk-trade')||{}).value, err=document.getElementById('auth-err');
  if(!name||!email||!pw){ if(err)err.textContent='Fill in name, email and password'; return; }
  if(!_wkConfigured()){ if(err)err.textContent='Worker accounts need the app connected to Supabase.'; return; }
  try{ const res=await sbSignUp(email.trim().toLowerCase(), pw, name);
    if(!(res&&res.session)){ if(err)err.textContent='Account created \u2014 check your email to confirm, then log in.'; return; }
    const prof=await sbWorkerEnsureProfile(name,email);
    if(trade) await sbWorkerSaveProfile({display_name:name, trade:trade});
    AUTH_STATE={loggedIn:true,user:{role:'worker',name:name,email:email,workerId:prof.id}}; saveAuth();
    afterLogin(AUTH_STATE.user);
  }catch(e){ if(err)err.textContent=(e&&e.message)||'Sign-up failed'; }
}
function wkTab(mode){
  ['login','register'].forEach(function(m){var el=document.getElementById('wk-tab-'+m);if(el)el.classList.toggle('act',m===mode);});
  const f=document.getElementById('wk-form'); if(!f)return;
  if(mode==='login'){ f.innerHTML=
    '<div class="fg"><label class="fl">Email</label><input class="fi" type="email" id="wk-email" placeholder="you@email.com"></div>'+
    '<div class="fg"><label class="fl">Password</label><input class="fi" type="password" id="wk-pw" placeholder="Password"></div>'+
    '<button class="btn" onclick="doWorkerLogin()" style="margin-bottom:10px;background:var(--amber);color:#fff">Login as worker \u2192</button>'+
    '<div id="auth-err" style="font-size:12px;color:var(--red);text-align:center;min-height:16px"></div>';
  } else { f.innerHTML=
    '<div class="fg"><label class="fl">Name / company</label><input class="fi" id="wk-name" placeholder="Your name"></div>'+
    '<div class="fg"><label class="fl">Trade</label><input class="fi" id="wk-trade" placeholder="plumber, electrician\u2026"></div>'+
    '<div class="fg"><label class="fl">Email</label><input class="fi" type="email" id="wk-email" placeholder="you@email.com"></div>'+
    '<div class="fg"><label class="fl">Password</label><input class="fi" type="password" id="wk-pw" placeholder="Choose a password"></div>'+
    '<button class="btn" onclick="doWorkerRegister()" style="margin-bottom:10px;background:var(--amber);color:#fff">Create worker account \u2192</button>'+
    '<div id="auth-err" style="font-size:12px;color:var(--red);text-align:center;min-height:16px"></div>';
  }
}

/* ---- worker home ---- */
function wkGo(tab){ window._wk.tab=tab; rWorkerHome(); }
async function rWorkerHome(){
  const main=document.getElementById('main'); if(!main)return;
  try{document.getElementById('bnav').style.display='none';}catch(e){}
  var back=document.getElementById('back-btn'); if(back)back.classList.remove('vis');
  document.getElementById('tb-title').textContent='Worker';
  document.getElementById('tb-sub').textContent=(AUTH_STATE.user&&AUTH_STATE.user.name)||'';
  document.getElementById('tb-actions').innerHTML='<button class="icon-btn" onclick="doLogout()" title="Log out" style="width:auto;padding:0 10px;font-size:12px;font-weight:700;color:var(--red)">Logout</button>';
  var W=window._wk;
  function seg(id,lbl){return '<button onclick="wkGo(\''+id+'\')" style="flex:1;border:0;cursor:pointer;font-size:13px;font-weight:600;padding:9px;border-radius:var(--rx);font-family:inherit;'+(W.tab===id?'background:var(--bg2);color:var(--blue-d);box-shadow:0 1px 2px rgba(0,0,0,.06)':'background:transparent;color:var(--txt2)')+'">'+lbl+'</button>';}
  main.innerHTML='<div style="padding:14px 14px 40px">'+
    '<div style="display:flex;gap:4px;background:var(--bg3);border-radius:var(--rs);padding:4px;margin-bottom:14px">'+seg('jobs','Find work')+seg('avail','Availability')+seg('profile','Profile')+'</div>'+
    '<div id="wk-body"><div style="color:var(--txt2);font-size:13px;padding:20px;text-align:center">Loading\u2026</div></div></div>';
  if(!_wkConfigured()){ document.getElementById('wk-body').innerHTML='<div class="alert alert-info">Connect the app to Supabase (fill in the two keys near the top of the file) to use worker accounts and see jobs.</div>'; return; }
  try{ if(W.tab==='jobs') await wkRenderJobs(); else if(W.tab==='avail') await wkRenderAvail(); else await wkRenderProfile(); }
  catch(e){ var b=document.getElementById('wk-body'); if(b)b.innerHTML='<div class="alert alert-warn">'+_wesc(e.message||e)+'</div>'; }
}
async function wkRenderJobs(){
  var res=await Promise.all([sbListOpenJobs(), sbMyApplications()]); var jobs=res[0], apps=res[1];
  var applied={}; apps.forEach(function(a){applied[a.job_id]=1;});
  var body=document.getElementById('wk-body'); if(!body)return;
  if(!jobs.length){ body.innerHTML='<div style="color:var(--txt2);font-size:13px;padding:20px;text-align:center">No open jobs right now.</div>'; return; }
  body.innerHTML=jobs.map(function(j){ var has=applied[j.id];
    return '<div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,33,30,.04)">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="font-size:15px;font-weight:700">'+_wesc(j.title)+'</div>'+
      (j.trade?'<span style="font-size:11px;font-weight:700;color:var(--blue-d);background:var(--blue-l);padding:3px 9px;border-radius:20px">'+_wesc(j.trade)+'</span>':'')+'</div>'+
      (j.location?'<div style="font-size:12px;color:var(--txt2);margin-top:2px">'+_wesc(j.location)+'</div>':'')+
      (j.description?'<div style="font-size:13px;color:var(--txt);margin-top:8px;line-height:1.5">'+_wesc(j.description)+'</div>':'')+
      (j.budget?'<div style="font-size:13px;font-weight:700;margin-top:8px">\u20ac'+j.budget+'</div>':'')+
      '<div style="margin-top:10px">'+(has?'<span style="font-size:12px;font-weight:700;color:var(--green-d);background:var(--green-l);padding:6px 12px;border-radius:20px">\u2713 Applied</span>':'<button class="btn" onclick="wkApply(\''+j.id+'\')" style="padding:9px;font-size:13px">Apply</button>')+'</div></div>';
  }).join('');
}
async function wkApply(jobId){ var note=prompt('Add a short message to the landlord (optional):')||'';
  try{ await sbApplyToJob(jobId, note); toast('Applied \u2713'); await wkRenderJobs(); }catch(e){ toast(e.message||'Could not apply','var(--red)'); } }
async function wkRenderAvail(){
  var prof=await sbWorkerLoadProfile(); window._wk.profile=prof;
  var days=prof?await sbWorkerLoadAvailability(prof.id):[]; var set={}; days.forEach(function(d){set[d]=1;});
  var names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun']; var body=document.getElementById('wk-body'); if(!body)return;
  body.innerHTML='<div style="font-size:13px;color:var(--txt2);margin-bottom:12px">Tap the days you\u2019re generally available. Landlords searching for workers can see this.</div>'+
   '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">'+
   names.map(function(n,i){var on=set[i];return '<button id="wk-d-'+i+'" onclick="wkToggleDay('+i+')" style="border:1.5px solid '+(on?'var(--blue)':'var(--bdr)')+';background:'+(on?'var(--blue)':'var(--bg2)')+';color:'+(on?'#fff':'var(--txt)')+';font-weight:700;font-size:13px;padding:12px 0;border-radius:var(--rs);width:62px;cursor:pointer">'+n+'</button>';}).join('')+
   '</div><button class="btn" onclick="wkSaveAvail()">Save availability</button>';
  window._wk._days={}; days.forEach(function(d){window._wk._days[d]=1;});
}
function wkToggleDay(i){ var s=window._wk._days||{}; if(s[i])delete s[i]; else s[i]=1; window._wk._days=s;
  var b=document.getElementById('wk-d-'+i); var on=!!s[i];
  b.style.background=on?'var(--blue)':'var(--bg2)'; b.style.color=on?'#fff':'var(--txt)'; b.style.borderColor=on?'var(--blue)':'var(--bdr)'; }
async function wkSaveAvail(){ try{ var prof=window._wk.profile||await sbWorkerLoadProfile(); if(!prof){ prof=await sbWorkerEnsureProfile(AUTH_STATE.user.name, AUTH_STATE.user.email); }
    await sbWorkerSetAvailability(prof.id, Object.keys(window._wk._days||{}).map(Number)); toast('Availability saved \u2713'); }catch(e){ toast(e.message||'Could not save','var(--red)'); } }
async function wkRenderProfile(){
  var p=await sbWorkerLoadProfile()||{}; var body=document.getElementById('wk-body'); if(!body)return;
  function fld(id,lbl,val,ph){return '<div class="fg"><label class="fl">'+lbl+'</label><input class="fi" id="wk-p-'+id+'" value="'+_wesc(val||'')+'" placeholder="'+(ph||'')+'"></div>';}
  body.innerHTML=fld('name','Name / company',p.display_name,'Your name')+fld('trade','Trade',p.trade,'plumber, electrician\u2026')+
    fld('area','Service area',p.service_area,'Brussels, Anderlecht')+fld('rate','Hourly rate (\u20ac)',p.hourly_rate,'45')+fld('phone','Phone',p.phone,'')+
    '<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0 14px"><input type="checkbox" id="wk-p-public" '+(p.is_public!==false?'checked':'')+'> List me in the public directory</label>'+
    '<button class="btn" onclick="wkSaveProfile()">Save profile</button>';
}
async function wkSaveProfile(){ function g(id){return (document.getElementById('wk-p-'+id)||{}).value;}
  var f={ display_name:g('name'), trade:g('trade'), service_area:g('area'), hourly_rate:parseFloat(g('rate'))||null, phone:g('phone'), is_public:(document.getElementById('wk-p-public')||{}).checked };
  try{ var prof=await sbWorkerLoadProfile(); if(!prof){ await sbWorkerEnsureProfile(f.display_name, AUTH_STATE.user.email); } await sbWorkerSaveProfile(f); toast('Profile saved \u2713'); }catch(e){ toast(e.message||'Could not save','var(--red)'); } }
</script>

<script>
/* ---- Messages: choose a tenant to talk to ---- */
function rMessagesList(){
  function e(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  setTB('Messages','Choose a tenant to message');
  var rows=[];
  (APP.properties||[]).forEach(function(p){
    (p.units||[]).forEach(function(u,i){
      var t=p.tenants&&p.tenants[u];
      if(t&&t.name){ rows.push({name:t.name, loc:p.short+' \u00b7 '+u, pid:p.id, idx:i}); }
    });
  });
  var main=document.getElementById('main'); if(!main)return;
  if(!rows.length){ main.innerHTML='<div style="padding:20px;color:var(--txt2);font-size:13px">No tenants yet. Add a tenant to a unit first.</div>'; return; }
  main.innerHTML='<div style="padding:12px 14px 40px">'+rows.map(function(r){
    var ini=r.name.split(' ').map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase();
    return '<button onclick="push({tab:\'settings\',view:\'messages\',propId:\''+r.pid+'\',unitIdx:'+r.idx+'})" '+
      'style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(20,33,30,.04)">'+
      '<span style="width:40px;height:40px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+e(ini)+'</span>'+
      '<span style="flex:1"><span style="display:block;font-size:15px;font-weight:600;color:var(--txt)">'+e(r.name)+'</span>'+
      '<span style="display:block;font-size:12px;color:var(--txt2);margin-top:1px">'+e(r.loc)+'</span></span>'+
      '<span style="color:var(--txt3);font-size:20px">\u203a</span></button>';
  }).join('')+'</div>';
}
</script>

<script>
/* ============ LANDLORD: job board, applicants, messaging, find workers ============ */
function _lesc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function _lcfg(){ return (typeof SBC!=='undefined' && SBC && typeof SB_URL!=='undefined' && SB_URL.indexOf('YOUR-PROJECT')<0); }

async function sbLandlordJobs(){ var r=await SBC.from('jobs').select('*').order('created_at',{ascending:false}); return r.data||[]; }
async function sbCreateJob(f){ var acc=await sbEnsureAccount(); var me=await SBC.auth.getUser();
  var e=(await SBC.from('jobs').insert({account_id:acc,posted_by:me.data.user.id,title:f.title,description:f.description||null,trade:f.trade||null,location:f.location||null,budget:f.budget||null,status:'open'})).error;
  if(e) throw new Error(e.message); }
async function sbJobById(id){ var r=await SBC.from('jobs').select('*').eq('id',id).limit(1); return (r.data&&r.data[0])||null; }
async function sbJobApplicants(jobId){
  var apps=(await SBC.from('job_applications').select('*').eq('job_id',jobId)).data||[];
  var ids=apps.map(function(a){return a.worker_id;}); var profs={};
  if(ids.length){ var wp=(await SBC.from('worker_profiles').select('profile_id,display_name,trade,phone,service_area').in('profile_id',ids)).data||[];
    wp.forEach(function(w){profs[w.profile_id]=w;}); }
  return apps.map(function(a){return {app:a, worker:profs[a.worker_id]||null};});
}
async function sbAcceptApplicant(jobId, workerId, appId){
  var e1=(await SBC.from('jobs').update({status:'assigned',assigned_worker:workerId}).eq('id',jobId)).error; if(e1) throw new Error(e1.message);
  var e2=(await SBC.from('job_applications').update({status:'accepted'}).eq('id',appId)).error; if(e2) throw new Error(e2.message);
}
async function sbJobMessages(jobId){ return (await SBC.from('job_messages').select('*').eq('job_id',jobId).order('created_at',{ascending:true})).data||[]; }
async function sbSendJobMessage(jobId, body){ var me=await SBC.auth.getUser();
  var e=(await SBC.from('job_messages').insert({job_id:jobId,sender_id:me.data.user.id,body:body})).error; if(e) throw new Error(e.message); }
async function sbSearchWorkers(trade, weekday){
  var q=SBC.from('worker_profiles').select('*').eq('is_public',true).eq('is_active',true);
  if(trade) q=q.ilike('trade','%'+trade+'%');
  var workers=(await q.limit(100)).data||[];
  if(weekday!==null&&weekday!==undefined&&weekday!==''){
    var ids=workers.map(function(w){return w.id;}); var avail={};
    if(ids.length){ var av=(await SBC.from('worker_availability').select('worker_id,weekday').in('worker_id',ids)).data||[];
      av.forEach(function(a){(avail[a.worker_id]=avail[a.worker_id]||[]).push(a.weekday);}); }
    workers=workers.filter(function(w){return (avail[w.id]||[]).indexOf(Number(weekday))>=0;}).map(function(w){w._days=avail[w.id]||[];return w;});
  }
  return workers;
}

/* ---- Job board ---- */
async function rJobsBoard(){
  setTB('Job board','Post work and review applicants');
  var main=document.getElementById('main'); if(!main)return;
  if(!_lcfg()){ main.innerHTML='<div style="padding:14px"><div class="alert alert-info">Connect the app to Supabase to post jobs and receive applications.</div></div>'; return; }
  main.innerHTML='<div style="padding:14px 14px 40px"><div style="color:var(--txt2);font-size:13px;padding:20px;text-align:center">Loading\u2026</div></div>';
  try{
    var jobs=await sbLandlordJobs(); var counts={}; var ids=jobs.map(function(j){return j.id;});
    if(ids.length){ var apps=(await SBC.from('job_applications').select('job_id').in('job_id',ids)).data||[];
      apps.forEach(function(a){counts[a.job_id]=(counts[a.job_id]||0)+1;}); }
    var h='<div style="padding:14px 14px 40px">';
    h+='<button class="btn" onclick="ljToggleForm()" style="margin-bottom:14px">+ Post a job</button>';
    h+='<div id="lj-form" style="display:none;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:14px">'+
       '<div class="fg"><label class="fl">Title</label><input class="fi" id="lj-title" placeholder="e.g. Fix leaking tap"></div>'+
       '<div class="fg"><label class="fl">Trade</label><input class="fi" id="lj-trade" placeholder="plumber"></div>'+
       '<div class="fg"><label class="fl">Location</label><input class="fi" id="lj-loc" placeholder="Rue Clemenceau, Anderlecht"></div>'+
       '<div class="fg"><label class="fl">Budget (\u20ac, optional)</label><input class="fi" id="lj-budget" type="number"></div>'+
       '<div class="fg"><label class="fl">Description</label><textarea class="fi" id="lj-desc" rows="3"></textarea></div>'+
       '<button class="btn" onclick="ljPostJob()">Post to board</button></div>';
    if(!jobs.length){ h+='<div style="color:var(--txt2);font-size:13px;padding:10px;text-align:center">No jobs yet. Post one above.</div>'; }
    else { h+=jobs.map(function(j){ var c=counts[j.id]||0;
      var badge=j.status==='open'?'<span style="font-size:11px;font-weight:700;color:var(--green-d);background:var(--green-l);padding:3px 9px;border-radius:20px">Open</span>':'<span style="font-size:11px;font-weight:700;color:var(--txt2);background:var(--bg3);padding:3px 9px;border-radius:20px">'+_lesc(j.status)+'</span>';
      return '<button onclick="push({view:\'jobdetail\',ctx:{jobId:\''+j.id+'\'}})" style="display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 2px rgba(20,33,30,.04)">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:15px;font-weight:700">'+_lesc(j.title)+'</span>'+badge+'</div>'+
        (j.trade?'<span style="font-size:12px;color:var(--txt2)">'+_lesc(j.trade)+(j.location?' \u00b7 '+_lesc(j.location):'')+'</span>':'')+
        '<div style="margin-top:8px;font-size:12px;font-weight:600;color:var(--blue-d)">'+c+' applicant'+(c!==1?'s':'')+' \u203a</div></button>';
    }).join(''); }
    h+='</div>'; main.innerHTML=h;
  }catch(e){ main.innerHTML='<div style="padding:14px"><div class="alert alert-warn">'+_lesc(e.message||e)+'</div></div>'; }
}
function ljToggleForm(){ var f=document.getElementById('lj-form'); if(f)f.style.display=(f.style.display==='none'?'block':'none'); }
async function ljPostJob(){ function g(id){return (document.getElementById('lj-'+id)||{}).value;}
  var title=g('title'); if(!title){ toast('Add a title','var(--red)'); return; }
  try{ await sbCreateJob({title:title,trade:g('trade'),location:g('loc'),budget:parseFloat(g('budget'))||null,description:g('desc')}); toast('Posted \u2713'); rJobsBoard(); }
  catch(e){ toast(e.message||'Could not post','var(--red)'); } }

/* ---- Job detail: applicants + messaging ---- */
async function rJobDetail(){
  var jobId=nav.ctx&&nav.ctx.jobId; setTB('Job','');
  var main=document.getElementById('main'); if(!main)return;
  if(!_lcfg()||!jobId){ main.innerHTML='<div style="padding:14px"><div class="alert alert-info">Not available.</div></div>'; return; }
  main.innerHTML='<div style="padding:14px">Loading\u2026</div>';
  try{
    var me=await SBC.auth.getUser(); window._authUid=me.data.user.id;
    var job=await sbJobById(jobId); if(!job){ main.innerHTML='<div style="padding:14px">Job not found.</div>'; return; }
    setTB(job.title, job.status);
    var applicants=await sbJobApplicants(jobId); var msgs=await sbJobMessages(jobId);
    var h='<div style="padding:14px 14px 40px">';
    h+='<div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:14px">'+
       (job.trade?'<div style="font-size:12px;color:var(--txt2)">'+_lesc(job.trade)+(job.location?' \u00b7 '+_lesc(job.location):'')+'</div>':'')+
       (job.description?'<div style="font-size:13px;margin-top:8px;line-height:1.5">'+_lesc(job.description)+'</div>':'')+
       (job.budget?'<div style="font-size:13px;font-weight:700;margin-top:8px">\u20ac'+job.budget+'</div>':'')+'</div>';
    h+='<div class="sect" style="padding-left:0">Applicants ('+applicants.length+')</div>';
    if(!applicants.length) h+='<div style="color:var(--txt2);font-size:13px;padding:6px 0 14px">No applicants yet.</div>';
    else h+=applicants.map(function(a){ var w=a.worker||{}; var name=w.display_name||'Worker'; var accepted=a.app.status==='accepted';
      return '<div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 14px;margin-bottom:8px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div style="font-size:14px;font-weight:600">'+_lesc(name)+'</div>'+
        (w.trade?'<div style="font-size:12px;color:var(--txt2)">'+_lesc(w.trade)+(w.service_area?' \u00b7 '+_lesc(w.service_area):'')+'</div>':'')+'</div>'+
        (accepted?'<span style="font-size:11px;font-weight:700;color:var(--green-d);background:var(--green-l);padding:4px 10px;border-radius:20px">\u2713 Accepted</span>':'<button class="btn" style="width:auto;padding:7px 12px;font-size:12px" onclick="ljAccept(\''+jobId+'\',\''+a.app.worker_id+'\',\''+a.app.id+'\')">Accept</button>')+'</div>'+
        (a.app.note?'<div style="font-size:13px;color:var(--txt);margin-top:8px">'+_lesc(a.app.note)+'</div>':'')+
        (w.phone?'<div style="font-size:12px;color:var(--txt2);margin-top:6px">\ud83d\udcde '+_lesc(w.phone)+'</div>':'')+'</div>';
    }).join('');
    h+='<div class="sect" style="padding-left:0">Messages</div>';
    h+='<div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;margin-bottom:10px;max-height:260px;overflow:auto">';
    if(!msgs.length) h+='<div style="color:var(--txt2);font-size:13px;text-align:center;padding:10px">No messages yet.</div>';
    else h+=msgs.map(function(m){ var mine=window._authUid&&m.sender_id===window._authUid;
      return '<div style="margin-bottom:8px;text-align:'+(mine?'right':'left')+'"><span style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:14px;font-size:13px;background:'+(mine?'var(--blue)':'var(--bg3)')+';color:'+(mine?'#fff':'var(--txt)')+'">'+_lesc(m.body)+'</span></div>';
    }).join('');
    h+='</div>';
    h+='<div style="display:flex;gap:8px"><input class="fi" id="lj-msg" placeholder="Write a message\u2026" style="flex:1"><button class="btn" style="width:auto;padding:0 16px" onclick="ljSend(\''+jobId+'\')">Send</button></div>';
    h+='</div>'; main.innerHTML=h;
  }catch(e){ main.innerHTML='<div style="padding:14px"><div class="alert alert-warn">'+_lesc(e.message||e)+'</div></div>'; }
}
async function ljAccept(jobId,workerId,appId){ try{ await sbAcceptApplicant(jobId,workerId,appId); toast('Applicant accepted \u2713'); rJobDetail(); }catch(e){ toast(e.message||'Failed','var(--red)'); } }
async function ljSend(jobId){ var el=document.getElementById('lj-msg'); var body=el&&el.value.trim(); if(!body)return; try{ await sbSendJobMessage(jobId,body); if(el)el.value=''; rJobDetail(); }catch(e){ toast(e.message||'Failed','var(--red)'); } }

/* ---- Find workers ---- */
async function rFindWorkers(){
  setTB('Find workers','Search the directory');
  var main=document.getElementById('main'); if(!main)return;
  if(!_lcfg()){ main.innerHTML='<div style="padding:14px"><div class="alert alert-info">Connect to Supabase to search the worker directory.</div></div>'; return; }
  var days=['Any','Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  main.innerHTML='<div style="padding:14px 14px 40px">'+
    '<div style="display:flex;gap:8px;margin-bottom:12px"><input class="fi" id="fw-trade" placeholder="Trade (e.g. plumber)" style="flex:1">'+
    '<select class="fi" id="fw-day" style="flex:0 0 108px">'+days.map(function(d,i){return '<option value="'+(i===0?'':(i-1))+'">'+d+'</option>';}).join('')+'</select></div>'+
    '<button class="btn" onclick="fwSearch()" style="margin-bottom:14px">Search</button><div id="fw-res"></div></div>';
  fwSearch();
}
async function fwSearch(){
  var res=document.getElementById('fw-res'); if(!res)return; res.innerHTML='<div style="color:var(--txt2);font-size:13px;text-align:center;padding:14px">Searching\u2026</div>';
  try{
    var trade=(document.getElementById('fw-trade')||{}).value||''; var wdRaw=(document.getElementById('fw-day')||{}).value; var wd=wdRaw===''?null:Number(wdRaw);
    var workers=await sbSearchWorkers(trade, wd);
    if(!workers.length){ res.innerHTML='<div style="color:var(--txt2);font-size:13px;text-align:center;padding:14px">No workers found.</div>'; return; }
    var names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    res.innerHTML=workers.map(function(w){ var av=(w._days||[]).sort(function(a,b){return a-b;}).map(function(d){return names[d];}).join(' ');
      return '<div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(20,33,30,.04)">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="font-size:15px;font-weight:700">'+_lesc(w.display_name)+'</div>'+
        (w.trade?'<span style="font-size:11px;font-weight:700;color:var(--blue-d);background:var(--blue-l);padding:3px 9px;border-radius:20px">'+_lesc(w.trade)+'</span>':'')+'</div>'+
        (w.service_area?'<div style="font-size:12px;color:var(--txt2);margin-top:2px">'+_lesc(w.service_area)+'</div>':'')+
        (w.hourly_rate?'<div style="font-size:13px;margin-top:6px">\u20ac'+w.hourly_rate+'/h</div>':'')+
        (av?'<div style="font-size:12px;color:var(--txt2);margin-top:6px">Available: '+av+'</div>':'')+
        '<div style="margin-top:8px;font-size:13px">'+(w.phone?'\ud83d\udcde '+_lesc(w.phone)+'  ':'')+(w.email?'\u2709 '+_lesc(w.email):'')+'</div></div>';
    }).join('');
  }catch(e){ res.innerHTML='<div class="alert alert-warn">'+_lesc(e.message||e)+'</div>'; }
}
</script>

</body>
