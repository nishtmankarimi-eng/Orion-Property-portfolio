<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* Refined dark palette — less contrast between levels */
  /* Light proptech palette (v25) */
  --bg:#F4F6F3;--bg2:#FFFFFF;--bg3:#EEF1EC;--bg4:#E4E8E2;
  --bdr:#E4E8E2;--bdr2:#D6DBD3;
  --txt:#16211E;--txt2:#5C6A66;--txt3:#93A09B;
  --blue:#0F7B84;--blue-d:#0B5F66;--blue-l:#E1F1F2;
  --green:#1E9E68;--green-d:#116B45;--green-l:#E3F4EC;
  --amber:#C6871B;--amber-d:#8A5B08;--amber-l:#FBF0D8;
  --red:#C2453C;--red-d:#93261E;--red-l:#FBE7E5;
  --purple:#7A5AF8;--purple-l:#ECE8FE;
  --teal:#0F9E8E;--teal-l:#E0F3F0;
  --pink:#D6558E;--pink-l:#FBE6F0;
  --epc-a:#00A651;--epc-b:#5FBF00;--epc-c:#F2C200;
  --epc-d:#F08A00;--epc-e:#EE4B2B;--epc-f:#B71C1C;
  /* compatibility aliases: old theme variable names -> light palette */
  --s0:#F4F6F3;--s1:#FFFFFF;--s3:#E4E8E2;
  --b0:#E4E8E2;--b1:#D6DBD3;
  --t0:#16211E;--t1:#5C6A66;--t2:#93A09B;
  --ac2:#0B5F66;--ac3:#E1F1F2;
  --err:#C2453C;--ok:#1E9E68;--warn:#C6871B;
  --r3:6px;--r6:10px;--r10:14px;
  --r:14px;--rs:10px;--rx:6px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;font-size:15px}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--st)}

/* ── TOPBAR ── */
#topbar{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--bdr);padding:10px 14px 9px;display:flex;align-items:center;gap:10px}
#back-btn{display:none;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:transparent;border:none;color:var(--txt2);font-size:18px;cursor:pointer;flex-shrink:0}
#back-btn.vis{display:flex}
#tb-text{flex:1;min-width:0}
#tb-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
#tb-sub{font-size:11px;color:var(--txt3);margin-top:1px}
#tb-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:8px;background:transparent;border:none;color:var(--txt2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:active{opacity:.6}

/* ── SCROLL AREA ── */
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(68px + var(--sb))}

/* ── BOTTOM NAV ── */
#bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bdr);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:var(--sb);z-index:100}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;cursor:pointer;color:var(--txt3);font-size:9px;font-weight:500;border:none;background:none;transition:color .12s;letter-spacing:.02em}
.bn.act{color:var(--blue)}
.bn svg{width:19px;height:19px;stroke-width:1.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.bn .dot{width:4px;height:4px;border-radius:50%;background:var(--red);position:absolute;top:6px;right:calc(50% - 13px)}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin:0 14px 8px}
.card-sm{background:var(--bg3);border-radius:var(--rs);padding:9px 11px}
.sect{font-size:10px;font-weight:600;color:var(--txt3);letter-spacing:.08em;text-transform:uppercase;padding:16px 14px 5px}

/* ── HERO ── */
.hero{padding:16px 14px 4px}
.hero-net{font-size:38px;font-weight:700;color:var(--green);line-height:1}
.hero-label{font-size:12px;color:var(--txt2);margin-top:3px}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--bg2);border:0.5px solid var(--bdr);border-radius:var(--rs);padding:10px;text-align:center}
.kpi-v{font-size:16px;font-weight:700}
.kpi-l{font-size:10px;color:var(--txt2);margin-top:2px}

/* ── PROP CARD ── */
.prop-card{background:var(--bg2);border:1px solid var(--bdr);border-left:3px solid var(--ac,var(--blue));border-radius:var(--r);padding:14px 14px 12px;margin:0 14px 8px;cursor:pointer;transition:border-color .12s,opacity .12s}
.prop-card:active{opacity:.8}
.prop-card h3{font-size:14px;font-weight:600;margin-bottom:2px;letter-spacing:-.01em}
.prop-card .meta{font-size:11px;color:var(--txt3);margin-bottom:10px}
.prop-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ps{background:var(--bg3);border-radius:var(--rx);padding:7px 8px}
.ps-l{font-size:9px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em}
.ps-v{font-size:13px;font-weight:600;margin-top:2px}

/* ── UNIT LIST ── */
.unit-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .08s}
.unit-item:active{background:var(--bg3)}
.unit-item:last-child{border-bottom:none}
.u-ico{width:36px;height:36px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.u-info{flex:1;min-width:0}
.u-name{font-size:13px;font-weight:500;letter-spacing:-.01em}
.u-meta{font-size:11px;color:var(--txt3);margin-top:2px;line-height:1.4}
.u-right{text-align:right;flex-shrink:0}
.u-rent{font-size:13px;font-weight:600;color:var(--green)}
.chev{color:var(--txt3);font-size:18px;margin-left:2px}

/* ── PILLS ── */
.pill{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:500;white-space:nowrap;letter-spacing:.02em}
.p-paid{background:rgba(63,185,80,.15);color:#3fb950}
.p-pend{background:var(--bg4);color:var(--txt2)}
.p-miss{background:rgba(248,81,73,.15);color:#f85149}
.p-late{background:rgba(210,153,34,.15);color:#d29922}
.p-prog{background:rgba(210,153,34,.15);color:#d29922}
.p-done{background:rgba(63,185,80,.15);color:#3fb950}
.p-plan{background:rgba(88,166,255,.15);color:#58a6ff}
.p-info{background:rgba(88,166,255,.15);color:#58a6ff}
.p-warn{background:rgba(210,153,34,.15);color:#d29922}
.p-new{background:rgba(188,140,255,.15);color:#bc8cff}

/* ── EPC ── */
.epc{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:5px;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.eA{background:var(--epc-a)}.eB{background:var(--epc-b);color:#000}.eC{background:var(--epc-c);color:#000}
.eD{background:var(--epc-d)}.eE{background:var(--epc-e)}.eF,.eG{background:var(--epc-f)}

/* ── MONTH GRID ── */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mcell{border-radius:var(--rx);padding:7px 4px;text-align:center;cursor:pointer;border:none;transition:.1s}
.mcell:active{transform:scale(.95)}
.mc-m{font-size:9px;font-weight:600;color:var(--txt2);margin-bottom:3px}
.mc-s{font-size:10px;font-weight:700}
.mc-paid{background:var(--green-l)}.mc-paid .mc-s{color:var(--green)}
.mc-miss{background:var(--red-l)}.mc-miss .mc-s{color:var(--red)}
.mc-late{background:var(--amber-l)}.mc-late .mc-s{color:var(--amber)}
.mc-pend{background:var(--bg3)}.mc-pend .mc-s{color:var(--txt2)}
.mc-na{background:var(--bg3);opacity:.35}.mc-na .mc-s{color:var(--txt3)}

/* ── BARS ── */
.brow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.blbl{font-size:11px;width:88px;flex-shrink:0}

<script>
/* ===== Supabase bridge + tenant-statement PDF (v22) ===== */
/* =====================================================================
   portfolio-supabase.js
   Auth + data bridge between the v21 app and Supabase.

   The app keeps its own in-memory shape (APP / pfv4). This module:
     • signs users in/up/out via Supabase Auth
     • loadPortfolio()  : reads the 18 tables -> rebuilds the pfv4 shape
     • savePortfolio()  : writes the pfv4 shape back to the tables

   SETUP: paste your project URL + anon key below (Supabase -> Settings -> API).
   Load AFTER the supabase-js CDN script and BEFORE the app boots.
   ===================================================================== */

/* Keys can be pasted in-app (saved on this device) OR hardcoded here. */
let SB_URL  = 'https://YOUR-PROJECT.supabase.co';   // optional: fill in
let SB_ANON = 'YOUR-ANON-KEY';                       // optional: fill in
try{ var _sbu=localStorage.getItem('sb_url'), _sba=localStorage.getItem('sb_anon');
  if(_sbu && _sba){ SB_URL=_sbu; SB_ANON=_sba; } }catch(e){}
const SBC = (window.supabase && SB_URL.indexOf('YOUR-PROJECT')<0) ? window.supabase.createClient(SB_URL, SB_ANON) : null;
function saveSupabaseKeys(){
  var u=(document.getElementById('setup-url')||{}).value, k=(document.getElementById('setup-key')||{}).value;
  if(!u||!k){ alert('Paste both the Project URL and the anon key'); return; }
  try{ localStorage.setItem('sb_url', u.trim()); localStorage.setItem('sb_anon', k.trim()); }catch(e){}
  alert('Saved on this device. The app will now reload.'); location.reload();
}
function _needsSetup(){ try{ return !(localStorage.getItem('sb_url')&&localStorage.getItem('sb_anon')); }catch(e){ return true; } }
function showSetupBox(){
  if(!_needsSetup()) return;
  if(document.getElementById('setup-box')) return;
  var d=document.createElement('div'); d.id='setup-box';
  d.setAttribute('style','position:fixed;left:0;right:0;bottom:0;z-index:99998;background:var(--bg2,#fff);border-top:2px solid var(--blue,#0F7B84);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.18);font-family:system-ui,sans-serif');
  d.innerHTML='<div style="max-width:520px;margin:0 auto">'+
    '<div style="font-weight:700;font-size:14px;color:var(--txt,#16211E);margin-bottom:2px">Connect to your cloud (one time)</div>'+
    '<div style="font-size:12px;color:var(--txt2,#5C6A66);margin-bottom:10px">Paste from Supabase → Settings → API. Saved on this device only.</div>'+
    '<input id="setup-url" placeholder="Project URL (https://xxxx.supabase.co)" style="width:100%;padding:11px;border:1px solid var(--bdr,#E4E8E2);border-radius:8px;font-size:14px;margin-bottom:8px;box-sizing:border-box">'+
    '<input id="setup-key" placeholder="anon public key (eyJ...)" style="width:100%;padding:11px;border:1px solid var(--bdr,#E4E8E2);border-radius:8px;font-size:14px;margin-bottom:10px;box-sizing:border-box">'+
    '<div style="display:flex;gap:8px"><button onclick="saveSupabaseKeys()" style="flex:1;padding:12px;border:0;border-radius:8px;background:var(--blue,#0F7B84);color:#fff;font-weight:700;font-size:14px;cursor:pointer">Save & connect</button>'+
    '<button onclick="document.getElementById(\'setup-box\').remove()" style="padding:12px 14px;border:1px solid var(--bdr,#E4E8E2);border-radius:8px;background:var(--bg3,#EEF1EC);color:var(--txt2,#5C6A66);font-size:14px;cursor:pointer">Later</button></div></div>';

/* ---------- AUTH ---------- */
async function sbSignIn(email, password){
  const { error } = await SBC.auth.signInWithPassword({ email, password });
  if(error) throw new Error(error.message);
  return sbCurrentUser();
}
async function sbSignUp(email, password, fullName, accountName){
  const { data, error } = await SBC.auth.signUp({
    email, password, options:{ data:{ full_name: fullName||'' } }
  });
  if(error) throw new Error(error.message);
  // If the project has email-confirmation off, we have a session now and can
  // create the account. Otherwise the app calls sbEnsureAccount() after login.
  if(data.session) await sbEnsureAccount(accountName||'My properties');
  return data;
}
async function sbSignOut(){ await SBC.auth.signOut(); }
async function sbCurrentUser(){ const { data } = await SBC.auth.getUser(); return data.user; }
async function sbHasSession(){ const { data } = await SBC.auth.getSession(); return !!data.session; }

async function sbAccountId(){
  const { data, error } = await SBC.from('account_members').select('account_id').limit(1);
  if(error) throw new Error(error.message);
  return (data && data[0]) ? data[0].account_id : null;
}
async function sbEnsureAccount(name){
  let id = await sbAccountId();
  if(id) return id;
  const { data, error } = await SBC.rpc('create_account', { account_name: name||'My properties' });
  if(error) throw new Error(error.message);
  return data;
}

/* ---------- month helpers ---------- */
const _MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const _LANG_BACK = { nl:'Dutch', fr:'French', de:'German', en:'English' };

/* =====================================================================
   assemblePortfolio(db): relational rows  ->  pfv4-shaped object
   (pure function — no network — so it can be unit-tested)
   ===================================================================== */
function assemblePortfolio(db){
  const byId   = arr => Object.fromEntries(arr.map(x=>[x.id,x]));
  const unitById       = byId(db.units);
  const renterById     = byId(db.renters);
  const contractorById = byId(db.contractors);

  const unitsByProp={}, leaseByUnit={}, paysByLease={},
        metersByUnit={}, readsByMeter={}, costsByProp={}, woByProp={};
  db.units.forEach(u => (unitsByProp[u.property_id] ||= []).push(u));
  db.leases.forEach(l => { leaseByUnit[l.unit_id] = l; });
  db.payments.forEach(p => (paysByLease[p.lease_id] ||= []).push(p));
  db.meters.forEach(m => (metersByUnit[m.unit_id] ||= []).push(m));
  db.readings.forEach(r => (readsByMeter[r.meter_id] ||= []).push(r));
  db.costs.forEach(c => ((costsByProp[c.property_id] ||= {})[c.category] = Number(c.amount)));
  db.work_orders.forEach(w => (woByProp[w.property_id] ||= []).push(w));

  // stable unit order per property (by created_at, then label)
  Object.values(unitsByProp).forEach(a => a.sort((x,y)=>
    (x.created_at||'')<(y.created_at||'') ? -1 :
    (x.created_at||'')>(y.created_at||'') ?  1 :
    String(x.label).localeCompare(String(y.label))));

  const properties = db.properties.map(p => {
    const us = unitsByProp[p.id] || [];
    const units = us.map(u=>u.label);
    const epc   = us.map(u=>u.epc_label || '');
    const area  = us.map(u=>Number(u.surface_m2)||0);
    const rent  = us.map(u=>Number(u.base_rent)||0);
    const rentStatus={}, tenants={}, meters={};

    us.forEach(u => {
      const L = u.label;
      const lease = leaseByUnit[u.id];
      if(lease){
        const r = renterById[lease.renter_id] || {};
        tenants[L] = {
          name:r.full_name||'', phone:r.phone||'', email:r.email||'',
          lang:_LANG_BACK[r.preferred_language] || r.preferred_language || '',
          leaseStart:lease.start_date||'', leaseEnd:lease.end_date||'',
          deposit:Number(lease.deposit)||0, depositLoc:lease.deposit_location||'',
          registered: lease.registered_with_commune ? 'Yes' : 'No',
          id:r.national_number||'', emergency:r.emergency_contact||'', emergencyPhone:r.emergency_phone||''
        };
        const grid={};
        (paysByLease[lease.id]||[]).forEach(pay=>{
          const d=new Date(pay.period_month);
          ((grid[d.getUTCFullYear()] ||= {}))[_MON[d.getUTCMonth()]] = pay.status;
        });
        rentStatus[L]=grid;
      }
      const ms = metersByUnit[u.id]||[];
      if(ms.length){
        const mo={};
        ms.forEach(m=>{
          const slot={ moveIn:{date:'',val:''}, cur:{date:'',val:''}, moveOut:{date:'',val:''} };
          (readsByMeter[m.id]||[]).forEach(rd=>{
            const key = rd.source==='move-in'?'moveIn' : rd.source==='move-out'?'moveOut' : 'cur';
            slot[key]={ date:rd.reading_date||'', val:Number(rd.value) };
          });
          mo[ m.kind==='electricity' ? 'elec' : m.kind ] = slot;
        });
        meters[L]=mo;
      }
    });

    // rebuild per-property contractors[] with their jobs[] from work_orders
    const cmap={};
    (woByProp[p.id]||[]).forEach(w=>{
      const c = contractorById[w.contractor_id] || { name:'Unknown' };
      const k = c.id || c.name;
      (cmap[k] ||= { trade:c.trade||'', color:c.color||'', name:c.name, contact:c.contact_name||'',
                     phone:c.phone||'', email:c.email||'', vat:c.vat_number||'',
                     rating:c.rating||0, preferred:!!c.preferred, jobs:[] }).jobs.push({
        date:w.service_date||'', unit: unitById[w.unit_id]?.label || '',
        desc:w.description||w.title||'', cost:Number(w.cost)||0, inv:w.invoice_number||'',
        status: w.status==='resolved'?'done' : w.status==='in_progress'?'progress' : w.status,
        warranty:w.warranty_until||''
      });
    });

    const costs = costsByProp[p.id] || {};
    return {
      id:p.id, name:p.name, short:p.short_name||p.name, location:p.city||'', color:p.color||'#60a5fa',
      units, epc, area, rent,
      totalIncome: rent.reduce((a,b)=>a+b,0),
      totalCosts:  Object.values(costs).reduce((a,b)=>a+(Number(b)||0),0),
      loan: Number(costs.loan)||0,
      rentStatus, tenants, meters, contractors:Object.values(cmap), costs,
      documents:[], maintenance:[], inspections:[]
    };
  });

  const s = db.settings || {};
  return {
    properties,
    notifications: db.notifications.map((n,i)=>({
      id:i+1, type:n.type||'info', title:n.title, body:n.body||'',
      time:n.time_label||'', read:!!n.is_read,
      propId:n.property_id||'', unit: n.unit_id ? (unitById[n.unit_id]?.label||'') : ''
    })),
    globalContractors: db.contractors.map(c=>({
      trade:c.trade||'', color:c.color||'', name:c.name, contact:c.contact_name||'',
      phone:c.phone||'', email:c.email||'', vat:c.vat_number||'', rating:c.rating||0, preferred:!!c.preferred
    })),
    settings: {
      currency:s.currency||'EUR', rentDueDayOfMonth:s.rent_due_day||1,
      reminderDaysBefore:s.reminder_days_before||5, darkMode:s.dark_mode!==false,
      lang:(s.language||'en').toUpperCase(), iban:s.iban||'', bic:s.bic||'',
      accountName:s.account_holder||'', payconiqId:s.payconiq_id||'', mollieLink:s.mollie_link||''
    },
    users:[],  // auth is handled by Supabase now, not APP.users
    inspectionTemplates: s.inspection_templates || {}
  };
}

/* ---------- LOAD: fetch all rows for the account, then assemble ---------- */
async function sbLoadPortfolio(){
  await sbEnsureAccount();
  const T = async (t)=>{ const { data, error } = await SBC.from(t).select('*').limit(10000);
                         if(error) throw new Error(t+': '+error.message); return data||[]; };
  const [properties, units, renters, leases, payments, meters, readings,
         contractors, work_orders, costs, notifications, settingsRows] = await Promise.all([
    T('properties'), T('units'), T('renters'), T('leases'), T('payments'),
    T('meters'), T('meter_readings'), T('contractors'), T('work_orders'),
    T('property_costs'), T('notifications'), T('account_settings')
  ]);
  return assemblePortfolio({
    properties, units, renters, leases, payments, meters, readings:readings,
    contractors, work_orders, costs, notifications, settings: settingsRows[0]||{}
  });
}

/* =====================================================================
   SAVE: pfv4-shaped object -> tables.
   First cut is a full re-sync for the account (clear, then insert),
   which is simple and always correct. Optimise to targeted upserts later.
   ===================================================================== */
async function sbSavePortfolio(APP){
  const accountId = await sbEnsureAccount();
  // wipe this account's data (children cascade via FKs)
  for(const t of ['payments','meter_readings','meters','leases','renters',
                  'work_orders','property_costs','notifications','units','properties']){
    const { error } = await SBC.from(t).delete().eq('account_id', accountId);
    if(error) throw new Error('clear '+t+': '+error.message);
  }
  const ins = async (t,row)=>{ const { data, error } = await SBC.from(t).insert(row).select('id').single();
                               if(error) throw new Error(t+': '+error.message); return data.id; };

  // settings + contractor address book
  if(APP.settings){
    const s=APP.settings;
    await SBC.from('account_settings').update({
      currency:s.currency, language:(s.lang||'en').toLowerCase(), rent_due_day:s.rentDueDayOfMonth,
      reminder_days_before:s.reminderDaysBefore, dark_mode:s.darkMode, iban:s.iban, bic:s.bic,
      account_holder:s.accountName, payconiq_id:s.payconiqId, mollie_link:s.mollieLink,
      inspection_templates:APP.inspectionTemplates||null
    }).eq('account_id', accountId);
  }
  const contractorId={};
  for(const c of (APP.globalContractors||[])){
    contractorId[c.name] = await ins('contractors', { account_id:accountId, name:c.name, trade:c.trade,
      contact_name:c.contact, color:c.color, rating:c.rating||null, preferred:!!c.preferred,
      phone:c.phone, email:c.email, vat_number:c.vat });
  }

  for(const p of APP.properties){
    const propId = await ins('properties', { account_id:accountId, name:p.name, short_name:p.short,
      color:p.color, city:p.location, region:null });
    // costs
    for(const [cat,amt] of Object.entries(p.costs||{}))
      await SBC.from('property_costs').insert({ account_id:accountId, property_id:propId, category:cat, amount:amt||0 });

    for(let i=0;i<(p.units||[]).length;i++){
      const label=p.units[i];
      const unitId = await ins('units', { account_id:accountId, property_id:propId, label,
        kind:/restaurant|commerc/i.test(label)?'commercial':'residential',
        surface_m2:(p.area||[])[i]||null, epc_label:(p.epc||[])[i]||null, base_rent:(p.rent||[])[i]||null });

      const t=(p.tenants||{})[label];
      let leaseId=null;
      if(t && t.name){
        const renterId = await ins('renters', { account_id:accountId, full_name:t.name, phone:t.phone,
          email:t.email, national_number:t.id, emergency_contact:t.emergency, emergency_phone:t.emergencyPhone,
          is_company:/\b(sprl|srl|sa|nv|bvba|bv)\b/i.test(t.name)||/bce/i.test(t.id||'') });
        if(t.leaseStart){
          leaseId = await ins('leases', { account_id:accountId, unit_id:unitId, renter_id:renterId,
            start_date:t.leaseStart, end_date:t.leaseEnd||null, initial_rent:(p.rent||[])[i]||0,
            current_rent:(p.rent||[])[i]||0, deposit:t.deposit||null, deposit_location:t.depositLoc,
            registered_with_commune:/yes/i.test(t.registered||'') });
        }
      }
      // payments from rent grid
      const grid=(p.rentStatus||{})[label];
      if(grid && leaseId){
        for(const [yr,months] of Object.entries(grid))
          for(const [mon,st] of Object.entries(months)){
            const mi=_MON.indexOf(mon); if(mi<0) continue;
            await SBC.from('payments').insert({ account_id:accountId, lease_id:leaseId,
              period_month:`${yr}-${String(mi+1).padStart(2,'0')}-01`, amount_due:(p.rent||[])[i]||0,
              status:['paid','pending','missing'].includes(st)?st:'pending',
              amount_paid: st==='paid'?((p.rent||[])[i]||0):0 });
          }
      }
      // meters
      const mm=(p.meters||{})[label];
      if(mm) for(const [mk,slots] of Object.entries(mm)){
        const kind = mk==='elec'?'electricity':mk;
        const meterId = await ins('meters', { account_id:accountId, property_id:propId, unit_id:unitId, kind });
        for(const [slot,src] of [['moveIn','move-in'],['cur','current'],['moveOut','move-out']]){
          const r=slots[slot];
          if(r && r.val!=='' && r.val!=null)
            await SBC.from('meter_readings').insert({ account_id:accountId, meter_id:meterId,
              value:r.val, reading_date:r.date||null, source:src, unit: kind==='water'?'m3':'kWh' });
        }
      }
    }

    // work orders from this property's contractor jobs
    for(const c of (p.contractors||[]))
      for(const j of (c.jobs||[])){
        const unitId = (p.units||[]).includes(j.unit)
          ? (await SBC.from('units').select('id').eq('property_id',propId).eq('label',j.unit).single()).data?.id : null;
        await SBC.from('work_orders').insert({ account_id:accountId, property_id:propId, unit_id:unitId||null,
          contractor_id:contractorId[c.name]||null, title:(j.desc||'Work order').slice(0,120), description:j.desc,
          status: j.status==='done'?'resolved' : j.status==='progress'?'in_progress' : 'open',
          cost:j.cost||null, invoice_number:(j.inv&&j.inv!=='—')?j.inv:null,
          warranty_until:j.warranty||null, service_date:j.date||null });
      }
  }

  // notifications
  for(const n of (APP.notifications||[])){
    let unitId=null;
    if(n.unit && n.propId){
      const r=await SBC.from('units').select('id,property_id').eq('label',n.unit);
      unitId = (r.data||[]).find(u=>u.property_id)?.id || null;
    }
    await SBC.from('notifications').insert({ account_id:accountId, type:n.type, title:n.title,
      body:n.body, time_label:n.time, is_read:!!n.read });
  }
}


const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const eur=n=>'EUR '+(Number(n)||0).toLocaleString('en-BE',{minimumFractionDigits:2,maximumFractionDigits:2});

  function computeStatement(APP, propId, unitLabel, year){
    const p=APP.properties.find(x=>x.id===propId)||APP.properties.find(x=>x.tenants&&x.tenants[unitLabel]);
    if(!p) throw new Error('Property not found');
    const idx=p.units.indexOf(unitLabel);
    const rent=Number((p.rent||[])[idx])||0;
    const t=(p.tenants||{})[unitLabel]||{};
    const grid=((p.rentStatus||{})[unitLabel]||{})[year]||{};
    const rows=MON.map(m=>{
      const st=grid[m]||null;                 // paid | pending | missing | null(not due)
      const due = st ? rent : 0;
      const paid = st==='paid' ? rent : 0;
      return { month:m, status:st, due, paid };
    });
    const totalDue = rows.reduce((a,r)=>a+r.due,0);
    const totalPaid= rows.reduce((a,r)=>a+r.paid,0);
    const outstanding = totalDue-totalPaid;   // the debt
    const s=APP.settings||{};
    return {
      landlord: s.accountName||'', iban:s.iban||'', bic:s.bic||'',
      property:p.name, unit:unitLabel, currency:s.currency||'EUR',
      tenant:t.name||'', leaseStart:t.leaseStart||'', leaseEnd:t.leaseEnd||'',
      monthlyRent:rent, year, rows, totalDue, totalPaid, outstanding,
      generated:new Date().toISOString().slice(0,10)
    };
  }

  function renderStatementPDF(ctor, d){
    const doc=new ctor({unit:'pt',format:'a4'});
    const W=595, M=40; let y=54;
    const ink=[29,28,26], mut=[115,114,108], line=[224,222,218],
          green=[47,107,79], amber=[138,109,31], red=[154,59,52], accent=[58,95,74];

    // header
    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(...ink);
    doc.text('Rent statement', M, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...mut);
    doc.text('Statement date: '+d.generated, W-M, y-8, {align:'right'});
    doc.text('Year: '+d.year, W-M, y+6, {align:'right'});
    y+=16; doc.setDrawColor(...line); doc.line(M,y,W-M,y); y+=22;

    // landlord + tenant blocks
    doc.setFontSize(9); doc.setTextColor(...mut);
    doc.text('FROM', M, y); doc.text('TO', W/2, y); y+=13;
    doc.setFontSize(11); doc.setTextColor(...ink); doc.setFont('helvetica','bold');
    doc.text(d.landlord||'Landlord', M, y); doc.text(d.tenant||'Tenant', W/2, y); y+=15;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink);
    doc.text(d.property+' — '+d.unit, M, y);
    const lease=(d.leaseStart||'?')+'  to  '+(d.leaseEnd||'ongoing');
    doc.text(lease, W/2, y); y+=14;
    doc.setTextColor(...mut); doc.setFontSize(9);
    doc.text('Monthly rent: '+eur(d.monthlyRent), W/2, y); y+=24;

    // table header
    const cols=[M, M+150, M+300, M+430, W-M];  // Month | Status | Due | Paid
    doc.setFillColor(...accent); doc.rect(M, y-12, W-2*M, 20, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.text('MONTH', cols[0]+6, y+2);
    doc.text('STATUS', cols[1]+6, y+2);
    doc.text('DUE', cols[3]-6, y+2, {align:'right'});
    doc.text('PAID', cols[4]-6, y+2, {align:'right'});
    y+=20;

    // rows
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    d.rows.forEach((r,i)=>{
      if(i%2===0){ doc.setFillColor(247,246,242); doc.rect(M, y-12, W-2*M, 18, 'F'); }
      doc.setTextColor(...ink); doc.text(r.month+' '+d.year, cols[0]+6, y);
      const label = r.status? r.status.charAt(0).toUpperCase()+r.status.slice(1) : '—';
      const col = r.status==='paid'?green : r.status==='missing'?red : r.status==='pending'?amber : mut;
      doc.setTextColor(...col); doc.setFont('helvetica','bold'); doc.text(label, cols[1]+6, y);
      doc.setFont('helvetica','normal'); doc.setTextColor(...ink);
      doc.text(r.due?eur(r.due):'—', cols[3]-6, y, {align:'right'});
      doc.text(r.paid?eur(r.paid):'—', cols[4]-6, y, {align:'right'});
      y+=18;
    });
    doc.setDrawColor(...line); doc.line(M,y-6,W-M,y-6); y+=12;

    // totals
    const totLine=(label,val,color,bold)=>{
      doc.setFont('helvetica',bold?'bold':'normal'); doc.setFontSize(bold?12:10);
      doc.setTextColor(...(color||ink));
      doc.text(label, cols[3]-6, y, {align:'right'});
      doc.text(eur(val), cols[4]-6, y, {align:'right'}); y+=(bold?20:16);
    };
    totLine('Total due', d.totalDue);
    totLine('Total paid', d.totalPaid, green);
    doc.setDrawColor(...line); doc.line(cols[2], y-8, W-M, y-8);
    totLine('Outstanding', d.outstanding, d.outstanding>0?red:green, true);

    // payment instructions
    if(d.outstanding>0 && (d.iban||d.bic)){
      y+=8; doc.setFillColor(250,246,236); doc.rect(M, y-12, W-2*M, 52, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...amber);
      doc.text('PLEASE SETTLE THE OUTSTANDING BALANCE', M+8, y+2); y+=16;
      doc.setFont('helvetica','normal'); doc.setTextColor(...ink); doc.setFontSize(9);
      if(d.iban) doc.text('IBAN: '+d.iban, M+8, y);
      if(d.bic)  doc.text('BIC: '+d.bic, M+220, y);
      y+=13; doc.text('Communication: rent '+d.property+' '+d.unit, M+8, y);
    }

    // footer
    doc.setFontSize(8); doc.setTextColor(...mut);
    doc.text('Generated from your property portfolio. Questions? Contact your landlord.', M, 812);
    return doc;
  }

  

function downloadTenantStatement(propId, unitLabel, year){
  try{
    if(!window.jspdf||!window.jspdf.jsPDF){ (window.toast?toast('PDF library not loaded','var(--err)'):alert('PDF library not loaded')); return; }
    var data=computeStatement(APP, propId, unitLabel, year||NOW_YR);
    var doc=renderStatementPDF(window.jspdf.jsPDF, data);
    doc.save('rent-statement-'+String(data.tenant||unitLabel).replace(/\s+/g,'-')+'-'+data.year+'.pdf');
  }catch(e){ (window.toast?toast('Could not create statement: '+e.message,'var(--err)'):alert(e.message)); }
}

function translateDOM(){
  if(LANG==='EN')return; // English is the base, no translation needed
  try{
    const main=document.getElementById('main');
    if(!main)return;
    const extra=UI_EXTRA[LANG]||{};
    // Build translation map: English UI string -> translated string
    const map={};
    Object.entries(UI_STRINGS).forEach(([en,key])=>{
      // Try T[LANG][key] first, then UI_EXTRA[LANG][key]
      const translated=(T[LANG]&&T[LANG][key])||extra[key];
      if(translated&&translated!==en) map[en]=translated;
    });
    // Walk all text nodes in #main and replace
    const walker=document.createTreeWalker(main,NodeFilter.SHOW_TEXT,null,false);
    const nodes=[];
    let node;
    while(node=walker.nextNode()) nodes.push(node);
    nodes.forEach(n=>{
      let txt=n.textContent;
      let changed=false;
      // Sort by length desc to replace longer strings first
      Object.keys(map).sort((a,b)=>b.length-a.length).forEach(en=>{
        if(txt.includes(en)){
          txt=txt.split(en).join(map[en]);
          changed=true;
        }
      });
      if(changed)n.textContent=txt;
    });
    // Also translate placeholder attributes
    main.querySelectorAll('[placeholder]').forEach(el=>{
      const ph=el.placeholder;
      Object.keys(map).sort((a,b)=>b.length-a.length).forEach(en=>{
        if(ph&&ph.includes(en))el.placeholder=ph.split(en).join(map[en]);
      });
    });
  }catch(e){console.warn('translateDOM error:',e.message);}
}

let APP={};

function migrateTenantPins(app){
  app.properties.forEach((p,pi)=>{
    p.units.forEach((u,i)=>{
      const t=p.tenants&&p.tenants[u];
      if(t&&t.name&&!t.pin){
        // Assign a simple PIN: property index + unit index + 10
        t.pin=String(1000+(pi*10)+i).slice(-4);
      }
    });
  });
}
function migrateRentStatus(app){
  app.properties.forEach(p=>{
    p.units.forEach(u=>{
      const rs=p.rentStatus[u]||{};
      const hasYears=Object.keys(rs).some(k=>!isNaN(k)&&Number(k)>2000);
      if(!hasYears){
        const flat={...rs};
        p.rentStatus[u]={};
        const yr=NOW_YR;
        p.rentStatus[u][yr]=flat;
      }
    });
  });
}
function load(){try{const s=localStorage.getItem('pfv2');APP=s?JSON.parse(s):JSON.parse(JSON.stringify(DEF));migrateRentStatus(APP);migrateTenantPins(APP);}catch(e){APP=JSON.parse(JSON.stringify(DEF));}
try{const s2=localStorage.getItem('pfv4');if(s2){APP=JSON.parse(s2);}}catch(e){}
}
function save(){try{localStorage.setItem('pfv4',JSON.stringify(APP));}catch(e){console.warn('Storage full',e);}
  try{ if(typeof SBC!=='undefined' && SBC && SB_URL.indexOf('YOUR-PROJECT')<0){ sbHasSession().then(function(ok){ if(ok) sbSavePortfolio(APP).catch(function(e){console.warn('Supabase sync failed',e);}); }); } }catch(e){} }

function P(){return APP.properties.find(p=>p.id===nav.propId)}
function U(){const p=P();return p?p.units[nav.unitIdx]:null}
function push(s){hst.push({...nav});Object.assign(nav,s);render()}
function goBack(){if(hst.length){Object.assign(nav,hst.pop());render();}else{gTab(nav.tab)}}

function gTab(t){
  nav={tab:t,view:'list',propId:null,unitIdx:null,subTab:0,addTab:0,ctx:{}};
  hst=[];
  document.querySelectorAll('.bn').forEach(b=>b.classList.remove('act'));
  const el=document.getElementById('bn-'+t);
  if(el)el.classList.add('act');
  render();
}

function setTB(title,sub='',actions=''){try{
  document.getElementById('tb-title').textContent=title;
  document.getElementById('tb-sub').textContent=sub;
  const selYrGlobal=window._globalYr||NOW_YR;
  document.getElementById('tb-actions').innerHTML=
    `<button class="icon-btn" onclick="showYearPicker()" aria-label="Select year" title="Year: ${selYrGlobal}" style="font-size:13px;font-weight:600;color:var(--blue);width:auto;padding:0 10px;border-radius:20px">${selYrGlobal}</button>`+
    `<button class="icon-btn" onclick="showLangPicker()" aria-label="Language" title="Language: ${LANG}" style="font-size:11px;font-weight:700;color:var(--amber);width:auto;padding:0 8px;border-radius:20px">${LANG}</button>`+
    (actions||'');
  document.getElementById('back-btn').classList.toggle('vis',hst.length>0);
  }catch(e){}
}

function showYearPicker(){
  removePickerOverlay();
  const overlay=document.createElement('div');
  overlay.id='picker-overlay';
  overlay.style.cssText='position:fixed;top:56px;right:8px;background:var(--bg2);border:0.5px solid var(--bdr2);border-radius:var(--r);padding:8px;z-index:300;min-width:140px;box-shadow:0 4px 20px rgba(0,0,0,.4)';
  const selYr=window._globalYr||NOW_YR;
  overlay.innerHTML=`<div style="font-size:11px;color:var(--txt2);padding:4px 8px 8px;font-weight:600">Select year</div>`+
    yRange().concat([NOW_YR+1]).map(y=>
      `<button onclick="window._globalYr=${y};removePickerOverlay();render()" style="display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:${y===selYr?'var(--blue-d)':'transparent'};color:${y===selYr?'#fff':'var(--txt)'};border-radius:var(--rs);font-size:13px;font-weight:${y===selYr?600:400};cursor:pointer">${y}${y===NOW_YR?' (current)':''}</button>`
    ).join('');
  document.body.appendChild(overlay);
  setTimeout(()=>document.addEventListener('click',removePickerOnOutside,{once:true}),50);
}

function showLangPicker(){
  removePickerOverlay();
  const overlay=document.createElement('div');
  overlay.id='picker-overlay';
  overlay.style.cssText='position:fixed;top:56px;right:8px;background:var(--bg2);border:0.5px solid var(--bdr2);border-radius:var(--r);padding:8px;z-index:300;min-width:160px;box-shadow:0 4px 20px rgba(0,0,0,.4)';
  const langs=[{k:'EN',label:'English'},{ k:'NL',label:'Nederlands'},{k:'FR',label:'Français'}];
  overlay.innerHTML=`<div style="font-size:11px;color:var(--txt2);padding:4px 8px 8px;font-weight:600">Language / Taal / Langue</div>`+
    langs.map(l=>
      `<button onclick="setLang('${l.k}');removePickerOverlay()" style="display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:${LANG===l.k?'var(--blue-d)':'transparent'};color:${LANG===l.k?'#fff':'var(--txt)'};border-radius:var(--rs);font-size:13px;font-weight:${LANG===l.k?600:400};cursor:pointer">${l.label}</button>`
    ).join('');
  document.body.appendChild(overlay);
  setTimeout(()=>document.addEventListener('click',removePickerOnOutside,{once:true}),50);
}

function removePickerOverlay(){const el=document.getElementById('picker-overlay');if(el)el.remove();}
function removePickerOnOutside(e){if(!document.getElementById('picker-overlay')?.contains(e.target))removePickerOverlay();}


function toast(msg,col='var(--green)'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=col;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);
}

function unreadCount(){return APP.notifications.filter(n=>!n.read).length}

function assistMode(m){const A=window._assist;A.mode=m;A.pdf=null;A.pdfName=null;A.result=null;A.chain=null;render();}

function assistFile(input){
  const f=input.files[0];if(!f)return;const A=window._assist;A.pdfName=f.name;
  const btn=input.previousElementSibling;if(btn)btn.innerHTML='📎 '+aEsc(f.name);
  if(f.type==='application/pdf'){const r=new FileReader();r.onload=()=>{A.pdf=r.result.split(',')[1];};r.readAsDataURL(f);}
  else{const r=new FileReader();r.onload=()=>{const p=document.getElementById('assist-paste');if(p)p.value=r.result;A.pdf=null;};r.readAsText(f);}
}

async function aFetch(system,content){
  const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system,messages:[{role:'user',content}]})});
  const data=await resp.json();
  const raw=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return JSON.parse(raw.replace(/```json/g,'').replace(/```/g,'').trim());
}

function assistErr(msg){const r=document.getElementById('assist-result');if(r)r.innerHTML=`<div class="alert alert-warn" style="margin:0">${aEsc(msg)}</div>`;}

async function assistAnalyze(){
  const A=window._assist,insur=A.mode==='insurance';
  const sit=document.getElementById('assist-sit').value.trim();
  const paste=document.getElementById('assist-paste').value.trim();
  const lang=document.getElementById('assist-lang').value;
  if(!A.pdf&&!paste){assistErr('Add your document first — upload a PDF or paste the text.');return;}
  if(!sit){assistErr('Tell me what happened so I can read the document against your situation.');return;}
  const go=document.getElementById('assist-go');go.disabled=true;const lbl=go.textContent;go.textContent='Reading…';
  document.getElementById('assist-result').innerHTML='';
  const docType=insur?'insurance policy':'residential rental contract (lease)';
  const recipient=insur?'insurer':'tenant';
  A.recipient=recipient;A.lang=lang;A.sit=sit;
  const system='You are a calm assistant helping a non-professional landlord in Belgium understand an '+docType+' they uploaded, against a situation they describe. Give an INITIAL, plain-language, NON-BINDING indication only — you are not a lawyer or insurer. Base your reading ONLY on the document and situation. Where it is silent or ambiguous, say so honestly. Paraphrase clauses; never copy long passages. Respond with ONLY a JSON object (no markdown) with keys: "verdict" ("likely_yes"|"conditional"|"likely_no"|"unclear"), "headline" (one short plain sentence), "reasoning" (2-4 short sentences), "clauses" (array up to 3 short paraphrased points), "options" (array up to 4 short actions incl. any deadlines), "draft_message" (a polite ready-to-send message in '+lang+' to the '+recipient+'). Keep every field concise.';
  const content=[];
  if(A.pdf)content.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:A.pdf}});
  else content.push({type:'text',text:'DOCUMENT TEXT:\n'+paste});
  content.push({type:'text',text:'SITUATION: '+sit+'\nRespond with the JSON object only.'});
  try{const out=await aFetch(system,content);A.result=out;A.chain=null;assistRenderResult(out);}
  catch(e){assistErr('Could not reach the AI reader. This feature runs inside Claude, or in your own app once its backend (with your API key) is connected — a plain offline file can\u2019t call the model directly.');}
  finally{go.disabled=false;go.textContent=lbl;}
}

function assistBlock(title,inner){return `<div style="margin-bottom:16px"><div style="font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt2);font-weight:600;margin-bottom:8px">${title}</div>${inner}</div>`;}
function assistList(arr){return '<div>'+arr.map((x,i)=>`<div style="display:flex;gap:9px;padding:8px 0;${i?'border-top:1px solid var(--bdr)':''};font-size:13px;color:var(--txt)"><span style="color:var(--blue)">•</span><span>${aEsc(x)}</span></div>`).join('')+'</div>';}
function assistCopy(id,btn){navigator.clipboard.writeText(document.getElementById(id).textContent);const o=btn.textContent;btn.textContent='Copied ✓';setTimeout(()=>btn.textContent=o,1500);}

function assistRenderResult(out){
  const insur=window._assist.mode==='insurance';
  const map={likely_yes:['--green',insur?'Likely covered':'Strong position'],conditional:['--amber',insur?'Conditional':'Mixed position'],likely_no:['--red',insur?'Likely not covered':'Weak position'],unclear:['--txt2','Unclear']};
  const v=map[out.verdict]||map.unclear;
  let h=`<div style="background:var(--bg2);border:1px solid var(--bdr);border-left:3px solid var(${v[0]});border-radius:var(--rs);padding:12px 14px;display:flex;gap:11px;align-items:center;margin-bottom:14px">

    <div style="font-size:14px;font-weight:600;color:var(--txt)">${aEsc(out.headline||'')}</div>
  </div>`;
  h+=assistBlock('Why',`<div style="font-size:13px;color:var(--txt);line-height:1.6">${aEsc(out.reasoning||'')}</div>`);

     <button class="btn btn-ghost" style="margin-top:8px" onclick="assistCopy('assist-draft',this)">Copy message</button>`);
  h+=`<button class="btn" style="margin-top:14px" id="assist-fu-btn" onclick="assistFollowups()">✉️ Generate follow-up sequence</button><div id="assist-chain" style="margin-top:14px"></div>`;
  document.getElementById('assist-result').innerHTML=h;
}

async function assistFollowups(){
  const A=window._assist;if(!A.result)return;
  const btn=document.getElementById('assist-fu-btn');btn.disabled=true;const lbl=btn.textContent;btn.textContent='Writing the sequence…';
  const recipient=A.recipient||'recipient';
  const system='You help a non-professional landlord in Belgium chase an unresponsive '+recipient+' about the situation below, with a short escalating sequence of messages in '+(A.lang||'English')+'. Use the correct Belgian register for the final step (a formal notice — "ingebrekestelling" in Dutch, "mise en demeure" in French). Respond with ONLY a JSON object (no markdown) with key "steps": an array of exactly 3 objects, each {"label":"short step name","wait_days":number of days to wait before this one (0 for the first),"message":"the ready-to-send message, 3-5 sentences"}. Escalate gently: 1 polite first request, 2 reminder, 3 formal notice referencing possible next steps.';
  const content=[{type:'text',text:'SITUATION: '+(A.sit||'')+'\nRecipient: '+recipient+'\nRespond with the JSON object only.'}];
  try{const out=await aFetch(system,content);A.chain=out.steps||[];A.chainSent={};assistRenderChain();}
  catch(e){document.getElementById('assist-chain').innerHTML='<div class="alert alert-warn" style="margin:0">Could not generate the sequence. Try again.</div>';}
  finally{btn.disabled=false;btn.textContent=lbl;}
}

function assistRenderChain(){
  const A=window._assist,steps=A.chain||[];
  let h=`<div style="font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt2);font-weight:600;margin-bottom:10px">Follow-up sequence</div>`;
  steps.forEach((s,i)=>{
    const sent=A.chainSent&&A.chainSent[i];
    h+=`<div style="background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);padding:12px;margin-bottom:10px;${sent?'opacity:.55':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:13px;font-weight:600;color:var(--txt)">${i+1}. ${aEsc(s.label||('Step '+(i+1)))}</div>
        <div style="font-size:11px;color:var(--txt2)">${(s.wait_days|0)===0?'Send now':'After '+(s.wait_days|0)+' days'}</div>
      </div>
      <div id="assist-fu-${i}" style="background:var(--bg3);border:1px solid var(--bdr2);border-radius:var(--rs);padding:10px;font-size:12px;line-height:1.55;white-space:pre-wrap;color:var(--txt)">${aEsc(s.message||'')}</div>

        <button class="btn ${sent?'btn-ghost':'btn-success'}" style="flex:1;margin:0" onclick="assistToggleSent(${i})">${sent?'Sent ✓ — undo':'Mark as sent'}</button>
      </div>
    </div>`;
  });
  document.getElementById('assist-chain').innerHTML=h;
}

function cycleStatus(m,yr){yr=yr||NOW_YR;const p=P();const u=U();const cur=rsY(p,u,yr)[m];const next={paid:'pending',pending:'missing',missing:'paid',late:'paid'}[cur]||'pending';rsY(p,u,yr)[m]=next;save();rRentDetail();}

function saveMonthModal(){
  const mo=document.getElementById('mm-mo')?.value;

function saveInspection(type){
  const p=P();const u=U();
  const notes=document.getElementById('insp-notes')?.value||'';

function saveUnitAdd(){
  const pid=document.getElementById('up-prop')?.value;
  const uName=document.getElementById('up-name')?.value?.trim();
  const rent=Number(document.getElementById('up-rent')?.value||0);
  const area=Number(document.getElementById('up-area')?.value||0);
  const epc=document.getElementById('up-epc')?.value||'D';
  if(!pid){toast('Select a property','var(--err)');return;}
  if(!uName){toast('Enter a unit name','var(--err)');return;}
  const p=APP.properties.find(x=>x.id===pid);
  if(!p){toast('Property not found','var(--err)');return;}
  if(p.units.includes(uName)){
    const warn=document.getElementById('up-existing-warn');
    if(warn){warn.style.display='block';warn.textContent='Unit "'+uName+'" already exists in '+p.short+'.';}
    return;
  }
  p.units.push(uName);
  p.rent.push(rent);
  p.area.push(area);
  p.epc.push(epc);
  if(!p.rentStatus[uName])p.rentStatus[uName]={};
  if(!p.tenants[uName])p.tenants[uName]={name:'',email:'',phone:'',pin:String(1000+Math.floor(Math.random()*9000))};
  p.totalIncome=p.rent.reduce((a,r)=>a+r,0);
  p.totalCosts=p.loan+p.insurance+p.tax+(p.unpredictables||0);
  save();
  toast(uName+' added to '+p.short+' ✓');

  // Refresh the existing units preview list
  const existingList=document.getElementById('up-existing-list');
  if(existingList){
    existingList.innerHTML=p.units.map((u,i)=>`
    <div style="display:flex;align-items:center;justify-content:space-between;
      padding:8px 10px;background:var(--s3);border-radius:var(--r6);margin-bottom:5px">

      </div>
      <span class="pill p-new" style="font-size:9px">saved</span>
    </div>`).join('');
  }

function deleteUnit(propId,unitIdx){
  const p=APP.properties.find(x=>x.id===propId);
  if(!p)return;
  const u=p.units[unitIdx];
  if(!confirm('Delete unit "'+u+'"? All rent data and tenant info for this unit will be removed.'))return;
  p.units.splice(unitIdx,1);
  p.rent.splice(unitIdx,1);
  p.area.splice(unitIdx,1);
  p.epc.splice(unitIdx,1);
  delete p.rentStatus[u];
  delete p.tenants[u];
  if(p.meters)delete p.meters[u];
  p.totalIncome=p.rent.reduce((a,r)=>a+r,0);
  save();
  toast('Unit deleted: '+u);
  rAdd(); // refresh the tab
}

function deleteProperty(propId){
  const p=APP.properties.find(x=>x.id===propId);
  if(!p)return;
  if(!confirm('Delete property "'+p.short+'" and ALL its units, tenants and data? This cannot be undone.'))return;
  APP.properties=APP.properties.filter(x=>x.id!==propId);
  save();
  toast('Property deleted: '+p.short);
  gTab('home');
}

function handleFileUpload(e){
  const files=[...e.target.files];if(!files.length)return;
  const p=APP.properties[0];
  showUploadModal(files,p);
}

function showUploadModal(files,defaultProp){
  const propOpts=APP.properties.map(p=>`<option value="${p.id}">${p.short}</option>`).join('');
  const cats=['Lease contract','EPC certificate','Meter photo','Renovation invoice','Permit / approval','Insurance','Other'];
  const m=document.getElementById('main');
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end';
  overlay.innerHTML=`<div style="background:var(--bg2);border-radius:var(--r) var(--r) 0 0;padding:20px 16px;width:100%;max-height:80vh;overflow-y:auto">
    <div style="font-size:14px;font-weight:600;margin-bottom:4px">Save ${files.length} file${files.length>1?'s':''}</div>
    <div style="font-size:12px;color:var(--txt2);margin-bottom:14px">${files.map(f=>f.name).join(', ')}</div>
    <div class="fg"><label class="fl">Property</label><select class="fs" id="up-prop" onchange="updUploadUnits()">${propOpts}</select></div>
    <div class="fg"><label class="fl">Unit (optional)</label><select class="fs" id="up-unit"><option value="">All / common</option></select></div>
    <div class="fg"><label class="fl">Category</label><select class="fs" id="up-cat">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">Note (optional)</label><input class="fi" type="text" id="up-note" placeholder="e.g. Signed lease Jan Vermeulen 2025"></div>
    <button class="btn btn-success" onclick="confirmUpload(${JSON.stringify(files.map(f=>f.name))})">Save to portfolio</button>
    <button class="btn btn-ghost" style="margin-top:6px" onclick="this.closest('.upload-overlay').remove()">Cancel</button>
  </div>`;
  overlay.className='upload-overlay';
  document.body.appendChild(overlay);
  updUploadUnits();
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      if(!window._uploadFiles)window._uploadFiles={};
      window._uploadFiles[file.name]={data:ev.target.result,type:file.type,size:file.size};
    };
    reader.readAsDataURL(file);
  });
}

function updUploadUnits(){
  const ps=document.getElementById('up-prop');const us=document.getElementById('up-unit');
  if(!ps||!us)return;
  const p=APP.properties.find(x=>x.id===ps.value);
  us.innerHTML='<option value="">All / common</option>'+(p?p.units.map(u=>`<option>${u}</option>`).join(''):'');
}

function confirmUpload(fileNames){
  const pid=document.getElementById('up-prop')?.value;
  const unit=document.getElementById('up-unit')?.value||'';
  const cat=document.getElementById('up-cat')?.value||'Other';
  const note=document.getElementById('up-note')?.value||'';
  const p=APP.properties.find(x=>x.id===pid);
  if(!p||!window._uploadFiles)return;
  if(!APP.documents)APP.documents=[];
  fileNames.forEach(name=>{
    const f=window._uploadFiles[name];if(!f)return;
    APP.documents.push({id:Date.now()+Math.random(),propId:pid,propName:p.short,unit,cat,name,date:new Date().toISOString().split('T')[0],note,data:f.data,type:f.type});

function initSigCanvas2(id){
  const canvas=document.getElementById(id);if(!canvas)return;
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#1d4ed8';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false;
  const pos=(e)=>{const r=canvas.getBoundingClientRect();const sc=canvas.width/r.width;const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*sc,y:(src.clientY-r.top)*sc};};
  const start=(e)=>{e.preventDefault();drawing=true;const pp=pos(e);ctx.beginPath();ctx.moveTo(pp.x,pp.y);};
  const move=(e)=>{e.preventDefault();if(!drawing)return;const pp=pos(e);ctx.lineTo(pp.x,pp.y);ctx.stroke();};
  const stop=()=>drawing=false;
  canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',stop);canvas.addEventListener('mouseleave',stop);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',stop);
}

function clearCanvas(id){const c=document.getElementById(id);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);}

function isCanvasBlank(id){
  const c=document.getElementById(id);if(!c)return true;
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
  for(let i=0;i<d.length;i+=4){if(d[i+3]>10&&!(d[i]>250&&d[i+1]>250&&d[i+2]>250))return false;}
  return true;
}

/* ── Belgian EPC/SEPA QR code generator ────────────────────────────────── */
function buildEPCString(iban,bic,name,amount,ref){
  // EPC069-12 (European Payments Council QR) format — supported by all Belgian banking apps
  const lines=[
    'BCD',        // Service Tag
    '002',        // Version
    '1',          // Character set (UTF-8)
    'SCT',        // Identification
    bic||'',      // BIC
    name||'',     // Beneficiary name
    iban||'',     // IBAN
    'EUR'+Number(amount).toFixed(2), // Amount
    '',           // Purpose
    ref||'',      // Remittance reference
    '',           // Remittance info
    '',           // Beneficiary to originator info
  ];
  return lines.join('\n');
}

/* ── Self-contained QR code generator (no external API) ─────────────────── */
function renderQR(canvasId,text){
  const canvas=document.getElementById(canvasId);
  if(!canvas||!text)return;
  // Micro QR encoder — Reed-Solomon ECC, full alphanumeric support
  // Uses qrcodegen library loaded inline below
  try{
    const qr=QRCodeGen.QrCode.encodeText(text,QRCodeGen.QrCode.Ecc.MEDIUM);
    const size=qr.size;
    const scale=Math.floor(canvas.width/size);
    const off=Math.floor((canvas.width-size*scale)/2);
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#000000';
    for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(qr.getModule(x,y))ctx.fillRect(off+x*scale,off+y*scale,scale,scale);
  }catch(e){
    // Fallback pattern if library not loaded yet
    drawQRFallback(canvasId,text);
  }
}
function drawQRFallback(canvasId,text){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const w=canvas.width;
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,w);
  // Draw a visual placeholder that looks like a QR
  ctx.fillStyle='#1f2937';
  const cells=21;const cs=Math.floor(w/cells);
  // Finder patterns (corners)
  [[0,0],[0,14],[14,0]].forEach(([r,c])=>{
    ctx.fillRect(c*cs,r*cs,7*cs,7*cs);
    ctx.fillStyle='#ffffff';ctx.fillRect((c+1)*cs,(r+1)*cs,5*cs,5*cs);
    ctx.fillStyle='#1f2937';ctx.fillRect((c+2)*cs,(r+2)*cs,3*cs,3*cs);
    ctx.fillStyle='#1f2937';
  });
  // Hash-based pattern for data area
  let hash=0;for(let i=0;i<text.length;i++)hash=(hash*31+text.charCodeAt(i))&0x7fffffff;
  for(let r=8;r<13;r++)for(let c=8;c<13;c++){if((hash>>(((r-8)*5+(c-8))%31))&1)ctx.fillRect(c*cs,r*cs,cs,cs);}
  // Reference label
  ctx.fillStyle='#6b7280';ctx.font=`${Math.max(8,cs-2)}px monospace`;
  ctx.fillText('SEPA QR',2,w-4);
}

        <div style="flex:${missMo};background:var(--red)"></div>

  }

  // ── Message thread ────────────────────────────────────────────────────────
  h+=`<div class="msg-wrap" id="msg-scroll" style="min-height:180px;padding-bottom:4px">`;
  if(!msgs.length){
    h+=`<div style="text-align:center;color:var(--txt3);font-size:12px;padding:30px 0">
      <div style="font-size:24px;margin-bottom:8px">💬</div>
      No messages yet${tenant.name?' — use the templates above to send '+tenant.name+' a payment request':''}
    </div>`;
  }

  msgs.forEach(m=>{
    const isOut=m.dir==='out';
    const typeColors={
      'pay-request':'#1d4ed8',
      'pay-reminder':'#92400e',
      'pay-confirmed':'#065f46',
      'incoming-payment':'#065f46',
      'pay-link':'#374151',
      'manual':'',
    };
    const typeBg=typeColors[m.type]||'';
    const typeIcon={
      'pay-request':'💶 ',
      'pay-reminder':'⚠ ',
      'pay-confirmed':'✅ ',
      'incoming-payment':'💳 ',
      'pay-link':'🔗 ',
    }[m.type]||'';
    const bubbleStyle=typeBg?`background:${typeBg}!important`:'';
    h+=`<div class="msg-bubble ${isOut?'msg-out':'msg-in'}" style="${bubbleStyle};white-space:pre-wrap;font-size:12px">${typeIcon}${m.text}</div>
    <div class="msg-time ${isOut?'':'msg-time-in'}">${m.time}${!isOut?' · '+m.from:''}</div>`;

    // If it's an incoming payment message, show confirm button inline
    if(m.type==='incoming-payment'&&m._month&&m._yr){
      h+=`<div style="align-self:flex-start;margin-bottom:8px">
        <button onclick="markPaidFromMsg('${m._month}',${m._yr})" style="padding:5px 10px;border-radius:var(--rs);border:none;background:var(--green-d);color:#fff;font-size:11px;font-weight:600;cursor:pointer">✓ Confirm & mark paid</button>
      </div>`;
    }
  });
  h+=`</div>`;

  // ── Input bar ─────────────────────────────────────────────────────────────
  h+=`<div class="msg-input-bar">
    ${tenant.phone?`<button style="padding:6px 8px;border-radius:var(--rs);border:0.5px solid var(--bdr2);background:var(--bg3);color:var(--blue);font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0" onclick="openSMS()">📱</button>`:''}
    ${tenant.email?`<button style="padding:6px 8px;border-radius:var(--rs);border:0.5px solid var(--bdr2);background:var(--bg3);color:var(--blue);font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0" onclick="openEmail()">✉</button>`:''}
    <textarea class="msg-input" id="msg-txt" rows="1" placeholder="Type a message…"></textarea>
    <button class="msg-send" onclick="sendMsg('${key}')" aria-label="Send">&#9658;</button>
  </div>`;

  document.getElementById('main').innerHTML=h;
  const area=document.getElementById('msg-txt');
  if(area){
    area.addEventListener('input',()=>{area.style.height='auto';area.style.height=Math.min(area.scrollHeight,140)+'px';});
    area.focus();
  }
  setTimeout(()=>{const ms=document.getElementById('msg-scroll');if(ms)ms.scrollTop=ms.scrollHeight;},60);
}

function sendPaymentRequestFromMsg(month,yr){
  // Called from message screen — logs message AND opens payment screen
  const p=P();const u=U();const i=nav.unitIdx;
  const tenant=p&&u&&p.tenants&&p.tenants[u]||{};
  const rent=p&&i!=null?p.rent[i]:0;
  const iban=APP.settings&&APP.settings.iban||'[IBAN not set — add in Settings]';
  const ref=buildRef(p,u,month,yr);
  const tLang=tenant.lang&&tenant.lang.startsWith('N')?'NL':tenant.lang&&(tenant.lang.startsWith('F')||tenant.lang.startsWith('fr'))?'FR':'EN';
  const tpl=MSG_TEMPLATES.payRequest[tLang]||MSG_TEMPLATES.payRequest.EN;
  const msg=tpl(tenant.name||'Tenant',month,yr,rent,ref,iban,p.short,u);
  const key=msgKey(p,u);
  pushMsg(key,'out',msg,'pay-request');
  toast('Payment request sent ✓');
  rMessages();
}

function recordIncomingPayment(month,yr){
  // Tenant tells you they paid — log it and confirm
  const p=P();const u=U();const i=nav.unitIdx;
  const tenant=p&&u&&p.tenants&&p.tenants[u]||{};
  const rent=p&&i!=null?p.rent[i]:0;
  const ref=buildRef(p,u,month,yr);
  const key=msgKey(p,u);
  const tLang=tenant.lang&&tenant.lang.startsWith('N')?'NL':tenant.lang&&(tenant.lang.startsWith('F')||tenant.lang.startsWith('fr'))?'FR':'EN';

  // Log incoming payment message
  const inMsgs={
    EN:`I have transferred €${rent} for ${month} ${yr}. Reference: ${ref}.`,
    NL:`Ik heb €${rent} overgeschreven voor ${month} ${yr}. Mededeling: ${ref}.`,
    FR:`J'ai viré €${rent} pour ${month} ${yr}. Communication: ${ref}.`,
  };
  pushMsg(key,'in',inMsgs[tLang]||inMsgs.EN,'incoming-payment');

  // Mark as paid
  rsY(p,u,yr)[month]='paid';

  // Send auto-confirmation
  const confTpl=MSG_TEMPLATES.payConfirmed[tLang]||MSG_TEMPLATES.payConfirmed.EN;
  const confMsg=confTpl(tenant.name||'Tenant',month,yr,rent,ref);
  pushMsg(key,'out',confMsg,'pay-confirmed');

  // Add notification
  if(!APP.notifications)APP.notifications=[];
  APP.notifications.unshift({id:Date.now(),type:'ok',title:'Payment received: '+u,body:`${p.short} · ${month} ${yr} · €${rent}`,time:'just now',read:false});

  save();
  toast('✓ Payment recorded — confirmation sent');
  rMessages();
}

function markPaidFromMsg(month,yr){
  // Simple mark paid from message screen without full confirmation flow
  const p=P();const u=U();const i=nav.unitIdx;
  const tenant=p&&u&&p.tenants&&p.tenants[u]||{};
  const rent=p&&i!=null?p.rent[i]:0;
  const ref=buildRef(p,u,month,yr);
  const key=msgKey(p,u);
  const tLang=tenant.lang&&tenant.lang.startsWith('N')?'NL':tenant.lang&&(tenant.lang.startsWith('F')||tenant.lang.startsWith('fr'))?'FR':'EN';
  rsY(p,u,yr)[month]='paid';
  const tpl=MSG_TEMPLATES.payConfirmed[tLang]||MSG_TEMPLATES.payConfirmed.EN;
  pushMsg(key,'out',tpl(tenant.name||'Tenant',month,yr,rent,ref),'pay-confirmed');
  if(!APP.notifications)APP.notifications=[];
  APP.notifications.unshift({id:Date.now(),type:'ok',title:'Payment confirmed: '+u,body:`${p.short} · ${month} ${yr} · €${rent}`,time:'just now',read:false});
  save();
  toast('✓ Marked paid — confirmation message added');
  rMessages();
}

function openSMS(){
  const p=P();const u=U();const tenant=p&&u&&p.tenants&&p.tenants[u]||{};
  const txt=document.getElementById('msg-txt')?.value||'';
  window.location='sms:'+(tenant.phone||'')+(txt?'?body='+encodeURIComponent(txt):'');
}
function openEmail(){
  const p=P();const u=U();const tenant=p&&u&&p.tenants&&p.tenants[u]||{};
  const txt=document.getElementById('msg-txt')?.value||'';
  const sub=encodeURIComponent('Rent payment '+(u||''));

function sendMsg(key){
  const txt=document.getElementById('msg-txt')?.value?.trim();if(!txt)return;
  pushMsg(key,'out',txt,'manual');
  rMessages();
}

function addIncomingMsg(key,text,from){

}

function buildRef(p,u,month,yr){
  const propCode=p?p.short.replace(/[^A-Z0-9]/gi,'').toUpperCase().slice(0,6):'PROP';
  const unitCode=u?u.replace(/[^A-Z0-9]/gi,'').toUpperCase().slice(0,4):'UNIT';
  return `${propCode}/${unitCode}/${month.toUpperCase()}${yr}`;
}

function openBankApp(url,month,yr){
  window.open(url,'_blank');
  // Log in messages that tenant was directed to bank
  const p=P();const u=U();const tenant=p&&u&&p.tenants&&p.tenants[u]||{};
  const i=nav.unitIdx;const rent=p&&i!=null?p.rent[i]:0;
  const ref=buildRef(p,u,month,yr);
  const key=msgKey(p,u);
  pushMsg(key,'out',`[System] Payment link opened for ${month} ${yr} — €${rent} — Ref: ${ref}`,'pay-link');
  save();
}

function copyPayDetails(iban,ref,amt){
  const txt=`IBAN: ${iban}\nAmount: €${amt}\nReference: ${ref}`;
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast('Copied ✓'));}
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied ✓');}
}

function sendPaymentRequest(month,yr){
  const p=P();const u=U();const i=nav.unitIdx;
  const tenant=p&&u&&p.tenants&&p.tenants[u]||{};
  const rent=p&&i!=null?p.rent[i]:0;
  const iban=APP.settings&&APP.settings.iban||'[your IBAN]';
  const ref=buildRef(p,u,month,yr);
  const tLang=tenant.lang&&tenant.lang.startsWith('N')?'NL':tenant.lang&&(tenant.lang.startsWith('F')||tenant.lang.startsWith('fr'))?'FR':'EN';
  const tpl=MSG_TEMPLATES.payRequest[tLang]||MSG_TEMPLATES.payRequest.EN;
  const msg=tpl(tenant.name||'Tenant',month,yr,rent,ref,iban,p.short,u);
  const key=msgKey(p,u);
  pushMsg(key,'out',msg,'pay-request');
  toast('Payment request logged in messages ✓');
  rPayments();
}

function sendPaymentReminder(month,yr){
  const p=P();const u=U();const i=nav.unitIdx;
  const tenant=p&&u&&p.tenants&&p.tenants[u]||{};
  const rent=p&&i!=null?p.rent[i]:0;
  const ref=buildRef(p,u,month,yr);
  const tLang=tenant.lang&&tenant.lang.startsWith('N')?'NL':tenant.lang&&(tenant.lang.startsWith('F')||tenant.lang.startsWith('fr'))?'FR':'EN';

  const tpl=MSG_TEMPLATES.payReminder[tLang]||MSG_TEMPLATES.payReminder.EN;
  const msg=tpl(tenant.name||'Tenant',month,yr,rent,ref,Math.max(1,daysLate));

function confirmPayment(month,yr){
  yr=yr||window._globalYr||NOW_YR;
  const p=P();const u=U();const i=nav.unitIdx;
  const tenant=p&&u&&p.tenants&&p.tenants[u]||{};
  const rent=p&&i!=null?p.rent[i]:0;
  const ref=buildRef(p,u,month,yr);
  const key=msgKey(p,u);

  // Mark as paid
  rsY(p,u,yr)[month]='paid';

  // Auto-send confirmation message in tenant language
  const tLang=tenant.lang&&tenant.lang.startsWith('N')?'NL':tenant.lang&&(tenant.lang.startsWith('F')||tenant.lang.startsWith('fr'))?'FR':'EN';
  const tpl=MSG_TEMPLATES.payConfirmed[tLang]||MSG_TEMPLATES.payConfirmed.EN;
  const msg=tpl(tenant.name||'Tenant',month,yr,rent,ref);
  pushMsg(key,'out',msg,'pay-confirmed');

  // Add notification
  if(!APP.notifications)APP.notifications=[];
  APP.notifications.unshift({id:Date.now(),type:'ok',title:'Payment confirmed: '+u,body:`${p.short} · ${month} ${yr} · €${rent}`,time:'just now',read:false});

  save();
  toast('✓ Paid — confirmation message sent automatically');
  rPayments();
}

/* ═══════════════════════════════════════════════
   ALERTS VIEW (all alerts in one place)
═══════════════════════════════════════════════ */
function rAlerts(){
  setTB('Alerts & reminders','');
  const alerts=[];
  const today=new Date();

  APP.properties.forEach(p=>{
    p.units.forEach((u,i)=>{
      const rs=p.rentStatus[u]||{};
      [NOW_YR-1,NOW_YR].forEach(yr=>{const rs2=rsY(p,u,yr);MO.forEach(m=>{
        if(rs2[m]==='missing')alerts.push({type:'miss',priority:1,title:`Missing rent: ${u}`,body:`${p.short} · ${m} ${yr} · €${p.rent[i]}`,action:()=>push({tab:'settings',view:'payments',propId:p.id,unitIdx:i})});
        if(rs2[m]==='late')alerts.push({type:'late',priority:2,title:`Late payment: ${u}`,body:`${p.short} · ${m} ${yr} · €${p.rent[i]}`,action:()=>push({tab:'settings',view:'payments',propId:p.id,unitIdx:i})});
      });});
      const tenant=p.tenants&&p.tenants[u];
      if(tenant&&tenant.leaseEnd){
        const d=new Date(tenant.leaseEnd);const days=Math.round((d-today)/(1000*60*60*24));
        if(days<0)alerts.push({type:'miss',priority:1,title:`Lease EXPIRED: ${u}`,body:`${p.short} · ${tenant.name} · Expired ${tenant.leaseEnd}`,action:()=>push({tab:'home',view:'unit',propId:p.id,unitIdx:i})});
        else if(days<30)alerts.push({type:'miss',priority:1,title:`Lease expires in ${days} days: ${u}`,body:`${p.short} · ${tenant.name} · ${tenant.leaseEnd}`,action:()=>push({tab:'home',view:'unit',propId:p.id,unitIdx:i})});
        else if(days<90)alerts.push({type:'warn',priority:2,title:`Lease expiry in ${days} days: ${u}`,body:`${p.short} · ${tenant.name} · ${tenant.leaseEnd}`,action:()=>push({tab:'home',view:'unit',propId:p.id,unitIdx:i})});
      }
      if(p.epc[i]==='F'||p.epc[i]==='G')alerts.push({type:'warn',priority:3,title:`EPC ${p.epc[i]}: renovation required`,body:`${p.short} · ${u} — Flemish obligation`,action:()=>push({tab:'settings',view:'epc'})});
    });
    p.contractors&&p.contractors.forEach(c=>c.jobs.forEach(j=>{
      if(j.warranty&&new Date(j.warranty)<today)alerts.push({type:'info',priority:4,title:`Warranty expired: ${j.desc}`,body:`${c.name} · ${p.short} · ${j.warranty}`,action:()=>{}});
    }));
  });

  alerts.sort((a,b)=>a.priority-b.priority);
  const colors={miss:'var(--red)',late:'var(--amber)',warn:'var(--amber)',info:'var(--blue)'};

  let h=`<div style="padding:8px 14px 4px;font-size:12px;color:var(--txt2)">${alerts.length} active alert${alerts.length!==1?'s':''}</div>`;
  if(!alerts.length){h+=`<div class="card" style="text-align:center;color:var(--green);padding:24px"><div style="font-size:24px;margin-bottom:8px">✓</div><div style="font-size:13px">All clear — no alerts</div></div>`;}
  window._alertActions=alerts.map(a=>a.action);
  alerts.forEach((a,idx)=>{
    h+=`<div class="alert-big ${a.type==='miss'?'':'alert-big-warn'}" style="border-color:${colors[a.type]}" onclick="window._alertActions[${idx}]&&window._alertActions[${idx}]()">
      <h4>${a.title}</h4>
      <p>${a.body}</p>
    </div>`;
  });
  document.getElementById('main').innerHTML=h;
}

/* ═══════════════════════════════════════════════
   INDEXATION CALCULATOR
═══════════════════════════════════════════════ */
function rIndexation(){
  const selYr=window._globalYr||NOW_YR;
  setTB(t('indexation')||'Rent indexation',t('calcForecast')||'Calculator & forecast');

  // Belgian health index data (base 2013=100)
  // Historical values + conservative projections
  const HEALTH_INDEX={
    2015:101.23,2016:102.11,2017:103.56,2018:105.34,2019:107.12,
    2020:107.45,2021:109.23,2022:119.87,2023:131.24,2024:135.89,
    2025:138.42,2026:140.10,
  };
  // Projected 2027-2032 at ~2% per year
  for(let y=2027;y<=2035;y++) HEALTH_INDEX[y]=Math.round(HEALTH_INDEX[2026]*(1+0.02*(y-2026))*100)/100;

  function calcIndexedRent(baseRent,baseYear,targetYear,baseMonth){
    const baseIdx=HEALTH_INDEX[baseYear]||100;
    const targetIdx=HEALTH_INDEX[targetYear]||100;
    return Math.round((baseRent*targetIdx/baseIdx)*100)/100;
  }

  let h=`
  <div class="card" style="margin-top:12px">
    <div style="font-size:12px;font-weight:500;margin-bottom:10px;color:var(--txt2)">Belgian Health Index (base 2013=100)</div>
    <div style="font-size:11px;color:var(--txt2);margin-bottom:10px;line-height:1.6">
      Belgian law allows annual rent indexation based on the health index. The indexed rent = base rent × (new index / start index).<br>
      Flanders: allowed for all leases · Brussels: restricted for EPC D/E/F/G · Wallonia: allowed with conditions.
    </div>
    <div class="fg"><label class="fl">Base monthly rent (€)</label><input class="fi" type="number" id="ix-rent" placeholder="e.g. 900" oninput="calcIdx()"></div>
    <div class="fr2">
      <div class="fg"><label class="fl">Lease start year</label>
        <select class="fs" id="ix-yr" onchange="calcIdx()">
          ${Object.keys(HEALTH_INDEX).filter(y=>y<=NOW_YR).map(y=>`<option value="${y}" ${y==2023?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label class="fl">Lease start month</label>
        <select class="fs" id="ix-mo" onchange="calcIdx()">
          ${MO.map(m=>`<option>${m}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="fg"><label class="fl">Region</label>
      <select class="fs" id="ix-region" onchange="calcIdx()">
        <option value="fl">Flanders (Vlaanderen)</option>
        <option value="bru">Brussels (Bruxelles)</option>
        <option value="wa">Wallonia (Wallonie)</option>
        <option value="nl">Netherlands</option>
        <option value="fr">France</option>
        <option value="de">Germany</option>
      </select>
    </div>
    <div class="fg"><label class="fl">EPC label (Brussels only)</label>
      <select class="fs" id="ix-epc" onchange="calcIdx()">
        <option>A</option><option>B</option><option>C</option>
        <option>D</option><option>E</option><option>F</option>
      </select>
    </div>
  </div>

  <div id="ix-result" style="padding:0 14px 8px"></div>

  <div class="sect">Future rent projection (10 years)</div>
  <div id="ix-projection" style="padding:0 14px 16px"></div>`;

  document.getElementById('main').innerHTML=h;

  window._healthIndex=HEALTH_INDEX;
  window._calcIndexedRent=calcIndexedRent;

  // Auto-fill from first unit
  const p=APP.properties[0];
  if(p&&p.rent[0]) document.getElementById('ix-rent').value=p.rent[0];
  calcIdx();
}

function calcIdx(){try{
  const rent=parseFloat(document.getElementById('ix-rent')?.value)||0;
  const startYr=parseInt(document.getElementById('ix-yr')?.value)||2023;
  const startMo=document.getElementById('ix-mo')?.value||'Jan';
  const region=document.getElementById('ix-region')?.value||'fl';
  const epc=document.getElementById('ix-epc')?.value||'A';
  const HI=window._healthIndex||{};
  const calc=window._calcIndexedRent;
  if(!rent||!calc) return;

  const currentYr=NOW_YR;
  const currentIdx=HI[currentYr]||140;
  const startIdx=HI[startYr]||100;

  // Region-specific rules
  const regionRules={
    fl:{name:'Flanders',allowed:true,note:'Annual indexation allowed for all leases. Apply on lease anniversary month.',rate:'Belgian health index'},
    bru:{name:'Brussels',allowed:epc==='A'||epc==='B'||epc==='C',note:epc==='A'||epc==='B'||epc==='C'?'Indexation allowed (EPC A/B/C).':'Indexation BLOCKED for EPC D/E/F/G in Brussels since Nov 2022.',rate:'Belgian health index'},
    wa:{name:'Wallonia',allowed:true,note:'Annual indexation allowed. Apply formula: new rent = base × (new index / start index).',rate:'Belgian health index'},
    nl:{name:'Netherlands',allowed:true,note:'Max indexation 2026: 4.5% (social housing) or CPI+1% (free market). Applies per July or lease anniversary.',rate:'CPI + 1% (free market)'},
    fr:{name:'France',allowed:true,note:'IRL (Indice de Référence des Loyers) applies. Quarterly index published by INSEE.',rate:'IRL (INSEE quarterly)'},
    de:{name:'Germany',allowed:true,note:'Mietspiegel applies locally. Max increase: 15-20% over 3 years depending on city.',rate:'Local Mietspiegel'},
  };

  const rule=regionRules[region]||regionRules.fl;
  const indexedRent=rule.allowed?Math.round(rent*(currentIdx/startIdx)*100)/100:rent;
  const increase=indexedRent-rent;
  const pct=Math.round((increase/rent)*100*10)/10;

  const resultDiv=document.getElementById('ix-result');
  if(resultDiv){
    resultDiv.innerHTML=`
    <div class="card" style="border-top:2px solid ${rule.allowed?'var(--green)':'var(--red)'}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
        <div>
          <div style="font-size:11px;color:var(--txt2)">${currentYr} indexed rent (${rule.name})</div>
          <div style="font-size:28px;font-weight:700;color:${rule.allowed?'var(--green)':'var(--red)'}">€${indexedRent.toLocaleString()}</div>
          <div style="font-size:11px;color:var(--txt2);margin-top:3px">
            ${rule.allowed?`+€${increase.toFixed(2)}/mo (+${pct}%) vs base rent`:'No increase allowed'}
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:10px;color:var(--txt2)">Annual gain</div>
          <div style="font-size:16px;font-weight:700;color:var(--green)">€${rule.allowed?(increase*12).toFixed(0):0}</div>
          <div style="font-size:10px;color:var(--txt2)">per year</div>
        </div>
      </div>
      <div style="font-size:11px;line-height:1.7;color:var(--txt2);padding:8px;background:var(--bg3);border-radius:var(--rs)">
        <strong style="color:var(--txt)">${rule.name}:</strong> ${rule.note}<br>
        <strong style="color:var(--txt)">Index:</strong> Start ${startYr}: ${HI[startYr]||'—'} → Now ${currentYr}: ${currentIdx} → Change: +${Math.round((currentIdx/startIdx-1)*100*10)/10}%
      </div>
      ${rule.allowed?`<button class="btn btn-ghost" style="margin-top:8px;font-size:12px;padding:8px" onclick="copyIndexMsg(${indexedRent},${increase.toFixed(2)})">💬 Copy notification for tenant</button>`:''}
    </div>`;
  }

  // 10-year projection table
  const projDiv=document.getElementById('ix-projection');
  if(projDiv&&rule.allowed){
    let rows='';
    const maxProj=Math.max(...Object.values({...HI}));
    for(let y=currentYr;y<=currentYr+9;y++){
      const idx=HI[y]||HI[currentYr]*Math.pow(1.02,y-currentYr);
      const projected=Math.round(rent*(idx/startIdx)*100)/100;
      const yr_increase=projected-rent;
      const barPct=Math.min(100,Math.round((yr_increase/rent)*100*3));
      const isFuture=y>currentYr;
      rows+=`<div style="display:flex;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--bdr)">
        <span style="font-size:12px;min-width:42px;color:${isFuture?'var(--txt2)':'var(--txt)'}${y===currentYr?';font-weight:600':''}">${y}${isFuture?' *':''}</span>
        <div style="flex:1;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin:0 10px">
          <div style="width:${barPct}%;height:100%;background:${isFuture?'var(--blue)':'var(--green)'};border-radius:3px"></div>
        </div>
        <span style="font-size:12px;font-weight:600;color:${isFuture?'var(--blue)':'var(--green)'};min-width:52px;text-align:right">€${projected.toLocaleString()}</span>
        <span style="font-size:10px;color:var(--txt3);min-width:44px;text-align:right">+${Math.round(yr_increase)}€</span>
      </div>`;
    }
    projDiv.innerHTML=`
    <div style="background:var(--bg2);border:0.5px solid var(--bdr);border-radius:var(--r);padding:12px 14px;overflow:hidden">
      ${rows}
      <div style="font-size:10px;color:var(--txt3);margin-top:8px">* Projected at ~2% annual health index growth</div>
    </div>
    <div style="margin-top:8px">
      <div class="sect" style="padding:8px 0 4px">Apply to your portfolio</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${APP.properties.flatMap(p=>p.units.map((u,i)=>{
          const t=p.tenants&&p.tenants[u];
          if(!t||!t.leaseStart)return'';
          const leaseYr=parseInt(t.leaseStart.split('-')[0])||2020;
          const leaseMo=MO[parseInt(t.leaseStart.split('-')[1]||1)-1]||'Jan';
          const baseRent=p.rent[i];
          const sIdx=HI[leaseYr]||100;
          const cIdx=HI[currentYr]||140;
          const newRent=Math.round(baseRent*(cIdx/sIdx)*100)/100;
          const gain=newRent-baseRent;
          return `<div style="background:var(--bg2);border:0.5px solid var(--bdr);border-radius:var(--rs);padding:10px">
            <div style="font-size:11px;font-weight:500">${p.short} · ${u}</div>
            <div style="font-size:10px;color:var(--txt2)">${t.name||'—'} · Since ${leaseYr}</div>
            <div style="font-size:14px;font-weight:700;color:var(--green);margin-top:4px">€${newRent}</div>
            <div style="font-size:10px;color:var(--txt2)">was €${baseRent} · +€${gain.toFixed(0)}/mo</div>
          </div>`;
        })).join('')}
      </div>
    </div>`;
  } else if(projDiv&&!rule.allowed){
    projDiv.innerHTML=`<div class="alert alert-warn">Indexation is not permitted for EPC ${epc} properties in Brussels under current rules.</div>`;
  }
}catch(e){console.error('calcIdx error:',e.message);}}

}

  tmpl.sections.forEach(s=>{

function copyLeaseTemplate(key){
  const tmpl=LEASE_TEMPLATES[key];if(!tmpl)return;
  const full=tmpl.sections.map(s=>s.h+'\n'+s.body).join('\n\n');
  const text=tmpl.title+'\n'+'='.repeat(50)+'\n\n'+tmpl.note+'\n\n'+full;
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Template copied ✓'));}
  else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied ✓');}
}

function downloadLeaseTemplate(key){
  const tmpl=LEASE_TEMPLATES[key];if(!tmpl)return;
  const full=tmpl.sections.map(s=>s.h+'\n'+s.body).join('\n\n');
  const text=tmpl.title+'\n'+'='.repeat(50)+'\n\n'+tmpl.note+'\n\n'+full;
  const blob=new Blob([text],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='lease-template-'+key+'.txt';a.click();
  URL.revokeObjectURL(url);toast('Downloaded ✓');
}
